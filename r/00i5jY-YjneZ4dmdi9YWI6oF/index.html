<!DOCTYPE html>
<html lang="pt-BR">
<head><meta name="robots" content="noindex,nofollow"><style id="_pub_hide">#btn-regerar,#lf-btn-scan,#lf-scan-status,[onclick*="regerarRelatorio"],[onclick*="lfGerarScan"],[onclick*="lfSalvarConfig"]{display:none!important}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Completo — Motel Xenon</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --laranja:#FF3B00; --laranja2:#FF6A3C; --preto:#0A0A0A; --cinza:#6b7280;
    --bg:#f4f5f7; --card:#ffffff; --linha:#e7e9ee; --txt:#16181d; --txt2:#5b616e;
    --verde:#16a34a; --vermelho:#dc2626; --azul:#2563eb;
    --sombra:0 1px 2px rgba(10,10,10,.04), 0 8px 24px rgba(10,10,10,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  header.topo{background:linear-gradient(135deg,#0A0A0A 0%,#1c1c20 60%,#2a1410 100%);
    color:#fff;padding:34px 0 26px;border-bottom:4px solid var(--laranja)}
  header.topo .wrap{padding-bottom:0}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .mark{width:46px;height:46px;border-radius:12px;background:var(--laranja);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff}
  .brand img,.brand .brand-logo{height:44px;width:auto;max-height:44px;max-width:210px;
    display:block;object-fit:contain;background:#fff;padding:7px 13px;border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.28)}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
  .brand .sub{font-size:12.5px;color:#c9cdd6;margin-top:2px}
  .periodo-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
  .periodo-pill b{color:var(--laranja2)}
  .idioma-pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    padding:6px 10px 6px 14px;border-radius:999px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px}
  .idioma-pill .ip-lbl{color:#c9cdd6;font-weight:600;font-size:12.5px}
  .idioma-pill select{background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;outline:none}
  .idioma-pill select option{color:#0A0A0A}
  .tabs{display:flex;gap:8px;margin-top:22px}
  .tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#e6e8ee;
    padding:11px 20px;border-radius:12px 12px 0 0;font-size:14px;font-weight:700;cursor:pointer;
    border-bottom:none;transition:.15s;display:flex;align-items:center;gap:8px}
  .tab:hover{background:rgba(255,255,255,.12)}
  .tab.ativo{background:var(--bg);color:var(--preto);border-color:var(--bg)}
  .presetbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--linha);border-radius:14px;
    padding:10px 12px;margin:14px 0 10px;box-shadow:var(--sombra);
    position:sticky;top:10px;z-index:200}
  /* DESKTOP: tudo numa LINHA só, sem cortar. A barra "quebra" o limite de 1180px
     do .wrap e usa min(96vw,1600px) — centralizada na viewport — pra caber Período
     + presets + (período/Atualizar/Comparar/Limpar empurrados à direita). Os cards
     abaixo seguem em 1180px. Neutralizo o 2º margin-left:auto (do Atualizar) pra o
     grupo da direita ficar junto em vez de espalhar. */
  @media(min-width:1000px){
    .presetbar{flex-wrap:nowrap; overflow-x:auto; gap:5px;
      width:min(97vw,1680px); margin-left:calc((100% - min(97vw,1680px))/2)}
    .presetbar .preset.regerar{margin-left:8px}
  }
  .presetbar.stuck{box-shadow:0 8px 24px rgba(10,10,10,.22);border-color:var(--laranja)}
  .preset{white-space:nowrap}
  .mes-sel{background:#f1f2f5;border:1px solid var(--linha);border-radius:10px;padding:6px 9px;
    font-size:12px;font-weight:600;color:var(--txt);cursor:pointer;flex:none}
  .mes-sel:hover{border-color:var(--laranja)}
  /* calendário próprio (seletor de período personalizado) */
  .cal-backdrop{position:fixed;inset:0;background:rgba(10,10,10,.35);z-index:490}
  .cal-pop{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:500;width:300px;
    background:#fff;border:1px solid var(--linha);border-radius:16px;
    box-shadow:0 16px 48px rgba(10,10,10,.28);padding:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-title{font-size:14px;font-weight:800;color:var(--txt)}
  .cal-nav{width:30px;height:30px;border-radius:9px;border:1px solid var(--linha);background:#f1f2f5;
    font-size:17px;line-height:1;color:var(--txt);cursor:pointer;font-weight:700}
  .cal-nav:hover{border-color:var(--laranja);color:var(--laranja)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-wd{font-size:10.5px;font-weight:800;color:var(--txt2);text-align:center;padding:4px 0;text-transform:uppercase}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;
    font-weight:600;color:var(--txt);border-radius:9px;cursor:pointer;transition:.1s}
  .cal-day:not(.off):not(.empty):hover{background:#ffe9df}
  .cal-day.empty{cursor:default}
  .cal-day.off{color:#cbd1db;cursor:not-allowed}
  .cal-day.inr{background:#ffe0d2}
  .cal-day.sel{background:var(--laranja);color:#fff;font-weight:800}
  .cal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
    border-top:1px solid var(--linha);padding-top:11px}
  .cal-sel{font-size:11.5px;font-weight:700;color:var(--txt2)}
  .cal-apply{background:var(--laranja);color:#fff;border:none;border-radius:9px;padding:7px 15px;
    font-size:12.5px;font-weight:700;cursor:pointer}
  .cal-apply:disabled{background:#d7dae0;cursor:not-allowed}
  .pb-periodo{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;
    font-weight:700;color:var(--txt2);background:#fff4ef;border:1px solid #ffd9c7;
    border-radius:999px;padding:5px 11px;white-space:nowrap;flex:none}
  .pb-periodo b{color:var(--laranja)}
  .pb-periodo .pb-dot{width:7px;height:7px;border-radius:50%;background:var(--laranja);flex:none;
    box-shadow:0 0 0 3px rgba(255,59,0,.18)}
  .cmp-toggle{white-space:nowrap;flex:none}
  .presetbar .lbl{white-space:nowrap}
  .presetbar .lbl{font-size:12.5px;font-weight:700;color:var(--txt2);margin-right:4px}
  .preset{background:#f1f2f5;border:1px solid var(--linha);border-radius:10px;
    padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--txt);transition:.12s}
  .preset:hover{border-color:var(--laranja);color:var(--laranja)}
  .preset.on{background:var(--laranja);color:#fff;border-color:var(--laranja)}
  .preset.regerar{margin-left:auto;background:var(--preto);color:#fff;border-color:var(--preto)}
  .preset.regerar:hover{background:var(--laranja);border-color:var(--laranja);color:#fff}
  .preset.regerar:disabled{opacity:.55;cursor:progress}
  /* overlay do botão Atualizar dados */
  .regen-bg{position:fixed;inset:0;background:rgba(10,10,10,.62);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
  .regen-bg.show{display:flex}
  .regen-box{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.42);overflow:hidden}
  .regen-head{display:flex;align-items:center;gap:12px;padding:20px 22px 6px}
  .regen-head h3{margin:0;font-size:18px;color:var(--preto)}
  .regen-spin{width:18px;height:18px;border:3px solid var(--linha);border-top-color:var(--laranja);border-radius:50%;animation:regen-rot .8s linear infinite;flex:none}
  .regen-spin.done{border-top-color:var(--verde);border-color:#cdebd6;animation:none}
  .regen-spin.err{border-top-color:var(--vermelho);border-color:#f3cccc;animation:none}
  @keyframes regen-rot{to{transform:rotate(360deg)}}
  .regen-sub{padding:0 22px 12px;color:var(--txt2);font-size:13px;line-height:1.5}
  .regen-log{margin:0 22px;padding:12px 14px;background:#0e0f12;color:#d7dbe2;border-radius:10px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow:auto;flex:1;white-space:pre-wrap;word-break:break-word;min-height:150px}
  .regen-foot{padding:14px 22px;display:flex;justify-content:flex-end;gap:10px}
  .regen-btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
  .regen-btn.ghost{background:#f1f2f5;border:1px solid var(--linha);color:var(--txt2)}
  .regen-btn.ghost:hover{border-color:var(--preto);color:var(--preto)}
  /* ---- toggle "comparar com período anterior" ---- */
  .cmp-toggle{display:inline-flex;align-items:center;gap:9px;background:#f1f2f5;
    border:1px solid var(--linha);border-radius:10px;padding:6px 12px;cursor:pointer;
    font-size:12.5px;font-weight:600;color:var(--txt);user-select:none}
  .cmp-toggle:hover{border-color:var(--laranja)}
  .cmp-sw{position:relative;width:38px;height:21px;border-radius:999px;background:#cbd1db;
    transition:.18s;flex:none}
  .cmp-sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;
    border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .cmp-toggle.on .cmp-sw{background:var(--laranja)}
  .cmp-toggle.on .cmp-sw::after{left:19px}
  /* ---- selo de variação (delta) ---- */
  .delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;
    padding:2px 7px;border-radius:999px;line-height:1.2;white-space:nowrap;vertical-align:middle}
  .delta svg{flex:none}
  .delta.up{background:#eafbe7;color:#15803d}
  .delta.down{background:#fdeaea;color:#b91c1c}
  .delta.flat{background:#eef0f4;color:#6b7280}
  .delta .dabs{font-weight:600;opacity:.8;font-size:10.5px}
  .kpi .k-val .delta{font-size:11px;margin-left:2px}
  .delta-row{margin-top:6px}
  body.cmp-off .delta{display:none !important}
  section{margin-top:30px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .sec-h .ico{width:30px;height:30px;border-radius:9px;background:#fff0eb;color:var(--laranja);
    display:flex;align-items:center;justify-content:center;font-size:16px}
  .sec-h .ico svg{display:block}
  .fc-titulo svg, .fconv svg{flex:none}
  .sec-h h2{font-size:18px;font-weight:800;letter-spacing:-.2px}
  .sec-h .tag{font-size:11.5px;color:var(--txt2);font-weight:600;background:#eef0f4;
    padding:3px 9px;border-radius:999px;margin-left:auto}
  .card{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);
    padding:22px;box-shadow:var(--sombra)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:880px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
  .kpi{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px 18px 16px;
    box-shadow:var(--sombra);position:relative;overflow:hidden}
  .kpi.ind-h{cursor:help}
  .kpi.ind-h:hover{border-color:var(--laranja)}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--laranja)}
  .kpi .k-lbl{font-size:12px;color:var(--txt2);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .kpi .k-val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:6px;line-height:1}
  .kpi .k-val small{font-size:15px;font-weight:700;color:var(--txt2)}
  .kpi .k-sub{font-size:12px;color:var(--txt2);margin-top:7px}
  .kpi.man::before{background:#cbd1db}
  .kpi.man .k-val{color:#9aa1ad;font-size:17px;font-weight:700}
  .funilbig{display:flex;flex-direction:column;gap:6px;align-items:center;padding:6px 0 2px}
  .fstage{width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:#fff;border-radius:12px;padding:18px 16px;transition:.16s;position:relative;
    box-shadow:0 6px 18px rgba(255,59,0,.16)}
  .fstage:hover{transform:translateY(-2px) scale(1.005);filter:brightness(1.05)}
  .fstage .fs-in{text-align:center}
  .fstage .fs-cap{font-size:11.5px;font-weight:700;letter-spacing:.5px;opacity:.92;text-transform:uppercase}
  .fstage .fs-num{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-top:2px}
  .fstage .fs-sub{font-size:12px;opacity:.9;margin-top:3px}
  .fstage .fs-conv{position:absolute;right:16px;top:50%;transform:translateY(-50%);
    background:rgba(0,0,0,.22);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
  .f-tofu{background:linear-gradient(135deg,#FFA877,#FF8A5B)}
  .f-mofu{background:linear-gradient(135deg,#FF7A45,#FF5A1F)}
  .f-bofu{background:linear-gradient(135deg,#FF4D14,#E62E00)}
  .funil-hint{text-align:center;font-size:12px;color:var(--txt2);margin-top:10px}
  .fw1{max-width:100%} .fw2{max-width:78%} .fw3{max-width:56%}
  /* ---- 3 funis lado a lado (template do topo) ---- */
  .funis3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:920px){.funis3{grid-template-columns:1fr}}
  .fcol{background:var(--card);border:1px solid var(--linha);border-radius:var(--radius);
    padding:18px 16px 16px;box-shadow:var(--sombra);display:flex;flex-direction:column}
  .fcol .fc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
  .fcol .fc-titulo{font-size:14.5px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
  .fcol .fc-sub{font-size:11.5px;color:var(--txt2);margin-bottom:12px}
  .fcol .fc-badge{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;background:#fff5cc;color:#92700a;border:1px solid #f3df9a;white-space:nowrap}
  .funilmini{display:flex;flex-direction:column;gap:5px;align-items:center}
  .fmstage{width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:#fff;border-radius:11px;padding:14px 12px;transition:.16s;position:relative;text-align:center}
  .fmstage:hover{transform:translateY(-2px) scale(1.01);filter:brightness(1.06)}
  .fmstage .fm-cap{font-size:10px;font-weight:700;letter-spacing:.4px;opacity:.92;text-transform:uppercase}
  .fmstage .fm-num{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.05;margin-top:2px}
  .fmstage .fm-sub{font-size:10.5px;opacity:.9;margin-top:2px}
  .fmstage .fm-vendas{margin-top:6px;display:inline-block;background:rgba(255,255,255,.95);
    color:#0A0A0A;font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:999px}
  .fmstage .fm-delta{margin-top:6px;display:flex;justify-content:center}
  .fmstage .fm-delta .delta{background:rgba(255,255,255,.92);font-size:11px}
  .fconv{align-self:center;font-size:11px;font-weight:700;color:var(--txt2);
    background:#f1f2f5;border:1px solid var(--linha);border-radius:999px;padding:2px 10px;margin:1px 0}
  .fmw1{max-width:100%} .fmw2{max-width:80%} .fmw3{max-width:60%} .fmw4{max-width:42%}
  /* paletas por funil */
  .fg-t1{background:linear-gradient(135deg,#FF8A5B,#FF6A3C)} .fg-t2{background:linear-gradient(135deg,#FF6A3C,#FF4D14)} .fg-t3{background:linear-gradient(135deg,#FF4D14,#E62E00)} .fg-t4{background:linear-gradient(135deg,#E62E00,#A81F00)}
  .fb-t1{background:linear-gradient(135deg,#5b8dff,#3a6fe0)} .fb-t2{background:linear-gradient(135deg,#3a6fe0,#2052c4)} .fb-t3{background:linear-gradient(135deg,#2052c4,#163a96)} .fb-t4{background:linear-gradient(135deg,#163a96,#0e2766)}
  .fo-t1{background:linear-gradient(135deg,#4ec77a,#22a356)} .fo-t2{background:linear-gradient(135deg,#22a356,#178043)} .fo-t3{background:linear-gradient(135deg,#178043,#0e5e30)} .fo-t4{background:linear-gradient(135deg,#0e5e30,#08401f)}
  .data-faixa{display:flex;align-items:center;gap:8px;background:#fff8e1;border:1px solid #f3df9a;
    color:#8a6d08;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:600;margin-bottom:14px}
  .data-faixa b{color:#7a5f00}
  .crmfunnel{display:flex;flex-direction:column;gap:5px}
  .crow{display:flex;align-items:center;gap:12px;cursor:default}
  .crow .cbar{height:42px;border-radius:10px;display:flex;align-items:center;padding:0 14px;color:#fff;
    font-weight:700;font-size:14px;min-width:64px;transition:.16s;white-space:nowrap;overflow:hidden}
  .crow:hover .cbar{filter:brightness(1.08)}
  .crow .cname{flex:0 0 210px;font-size:13px;font-weight:600;color:var(--txt)}
  .crow .cmeta{font-size:12px;color:var(--txt2);margin-left:auto;white-space:nowrap}
  @media(max-width:620px){.crow .cname{flex-basis:130px;font-size:11.5px}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--linha)}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#fafbfc;font-weight:700;color:var(--txt2);font-size:11.5px;
    text-transform:uppercase;letter-spacing:.3px}
  tbody tr:hover{background:#fff7f4}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--linha);border-radius:14px;background:var(--card);
    box-shadow:var(--sombra)}
  .nodata{color:#9aa1ad;font-style:italic}
  .chartcard{background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:18px;
    box-shadow:var(--sombra)}
  .chartcard h3{font-size:14px;font-weight:700;margin-bottom:4px}
  .chartcard .ch-sub{font-size:12px;color:var(--txt2);margin-bottom:12px}
  .seg-toggle{display:inline-flex;gap:0;border:1px solid var(--linha);border-radius:9px;overflow:hidden}
  .seg-tg{background:#f1f2f5;border:none;padding:5px 11px;font-size:11.5px;font-weight:600;
    color:var(--txt2);cursor:pointer;transition:.12s}
  .seg-tg.on{background:var(--laranja);color:#fff}
  .seg-tg:not(.on):hover{background:#e7e9ee}
  /* ---- Campanhas do período: filtro + cards melhor/pior ---- */
  .cp-filtro{display:inline-flex;flex-wrap:wrap;gap:0;border:1px solid var(--linha);
    border-radius:10px;overflow:hidden}
  .cp-fb{background:#f1f2f5;border:none;padding:6px 14px;font-size:12px;font-weight:600;
    color:var(--txt2);cursor:pointer;transition:.12s;border-right:1px solid var(--linha)}
  .cp-fb:last-child{border-right:none}
  .cp-fb.on{background:var(--laranja);color:#fff}
  .cp-fb:not(.on):hover{background:#e7e9ee}
  .cp-resumo{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
  .cp-chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);
    border:1px solid var(--linha);border-radius:12px;padding:9px 14px;box-shadow:var(--sombra)}
  .cp-chip .cc-n{font-size:18px;font-weight:800;color:var(--txt)}

  .recon-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--linha);font-size:13px}
  .recon-row:last-child{border-bottom:none}
  .recon-row .rc-v{font-weight:800}
  .check-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
  .check-row .ck{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
  .check-row .ck.on{background:#eafbe7;color:#15803d} .check-row .ck.off{background:#fff5cc;color:#92700a}
  .changelog-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--linha);font-size:12.5px}
  .changelog-item:last-child{border-bottom:none}
  .changelog-item b{flex:0 0 46px;color:var(--laranja)}
  /* ---- base de dados ---- */
  .db-src-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:10px}
  .db-src-head .db-ic{width:32px;height:32px;border-radius:9px;background:#fff0eb;color:var(--laranja);
    display:flex;align-items:center;justify-content:center;flex:none}
  .db-src-head .db-t{font-size:15px;font-weight:800}
  .db-src-head .db-meta{font-size:11.5px;color:var(--txt2);font-weight:600}
  .db-src-head .db-meta b{color:var(--txt)}
  .db-block{margin-bottom:30px}
  table.db td,table.db th{font-variant-numeric:tabular-nums;font-size:12px;padding:8px 10px}
  table.db thead th{position:sticky;top:0;z-index:1}
  .parcial-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
    background:#fff5cc;color:#92700a;border:1px solid #f3df9a;padding:1px 7px;border-radius:999px;margin-left:6px}
  @media print{
    body{background:#fff}
    .presetbar,.tabs,#ftip,.modal-bg{display:none !important}
    .card,.kpi,.chartcard,.creativecard,.tbl-wrap{box-shadow:none;break-inside:avoid}
    header.topo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .fstage,.f-tofu,.f-mofu,.f-bofu,.cbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>

/* =========================================================================

   D.blocos = { chave_bloco: true|false } vindo do clientes.json[cliente].blocos.

   (some, nem "sem dado"). O layout continua unico/central; so a visibilidade
   muda por cliente. Chaves documentadas no README do motor.
   ========================================================================= */
const BLOCOS = (D && D.blocos) || {};
function blocoAtivo(chave){
  if(chave==null) return true;
  const v = BLOCOS[chave];
  return (v===undefined || v===null) ? true : !!v;
}

      + b.multi.map(p=>`<g fill="${p.fill}">${p.path}</g>`).join("") + `</svg>`;

}

/* =========================================================================
   IDIOMA / MOEDA derivam do cliente (config injetada). US -> en-US/US$, BR -> pt-BR/R$.
   IDIOMA_CFG mapeia o locale numérico e o símbolo de moeda. Trocar o
   seletor re-renderiza as 3 abas com os rótulos/moeda corretos.
   (Neste template os textos da UI ficam em PT-BR; a estrutura já está
    preparada pra trocar — só o locale numérico e a moeda mudam ao vivo.)
   ========================================================================= */
const IDIOMA_CFG = {
  "en-US": {locale:"en-US", moeda:"US$", nome:"English"},
  "pt-BR": {locale:"pt-BR", moeda:"R$",  nome:"Português"}
};
/* Idioma/moeda DERIVAM do cliente (config injetada no payload). O motor e UNICO:
   nenhum cliente fica hardcoded — cliente US herda en-US/US$, cliente BR pt-BR/R$.
   A moeda real do cliente sobrescreve o simbolo padrao do locale. */
const CLI = (D && D.cliente) || {};
let IDIOMA = CLI.idioma || "pt-BR" || "pt-BR";
if(CLI.moeda){ if(IDIOMA_CFG[IDIOMA]) IDIOMA_CFG[IDIOMA].moeda = CLI.moeda; }
function cfgIdioma(){ return IDIOMA_CFG[IDIOMA] || IDIOMA_CFG["pt-BR"]; }
function locNum(){ return cfgIdioma().locale; }
function simMoeda(){ return cfgIdioma().moeda; }

function fi(n){ if(n==null||isNaN(n)) return "—"; return Math.round(n).toLocaleString(locNum()); }
function fusd(n){ if(n==null||isNaN(n)) return "—"; return simMoeda()+" "+Number(n).toLocaleString(locNum(),{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fpct(n){ if(n==null||isNaN(n)) return "—"; return Number(n).toLocaleString(locNum(),{maximumFractionDigits:1})+"%"; }
function fdur(s){ if(s==null||isNaN(s)) return "—"; const m=Math.floor(s/60),x=Math.round(s%60); return m+"m "+x+"s"; }
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function okMes(o,ym){ const m=((o||{}).meses||{})[ym]; return m && m.status==="ok" ? m : null; }
function escTxt(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* =========================================================================
   CAMPOS EDITÁVEIS (input manual / valor faltando / override de automático)
   -------------------------------------------------------------------------
   Template/placeholder — NÃO puxa dado de API. São inputs que o Bruno
   preenche à mão. O valor digitado PERSISTE em localStorage, por período
   ativo (preset) + id do campo, e é recarregado a cada re-render das abas.
   - mField(opts) -> string HTML de um campo editável com borda tracejada,
     ícone de lápis e (opcional) etiqueta "manual"/"falta dado"/"ajustado".
   - Ao trocar o período (preset), os valores manuais daquele período são
     recarregados; "Limpar valores manuais" reseta só o período atual.
   ========================================================================= */
let PERIODO_ATIVO = "mes";              // default: Este mês (espelha o preset selecionado)
let MESES_ATIVOS = [...(D.meses||[])];   // meses efetivamente filtrados no dashboard
// RANGE_ATIVO = janela real de datas ISO {ini,fim} do preset. FONTE UNICA de período.
// MESES_ATIVOS deriva dele; os agregadores escolhem dia OU mês a partir dele.
let RANGE_ATIVO = {ini:null, fim:null};
const MF_NS = "mf_" + (CLI.slug || "08_motel_xenon" || "cliente");   // namespace localStorage por cliente

/* =========================================================================
   PERÍODO — FONTE ÚNICA (preset -> range de datas reais; agrega de UMA base).
   -------------------------------------------------------------------------
   rangeDoPreset(p) -> {ini,fim} (ISO AAAA-MM-DD). Usado por TODAS as abas.
   mesesNoRange / diasNoRange / subMensal classificam a janela.
   somaDias(fonteDias,ini,fim,campo) soma a granularidade diária.
   somaCampoFonte(fonte,campo) é o agregador universal: usa dias quando a janela
   é sub-mensal (Hoje/Esta semana) e a fonte tem 'dias'; senão soma os meses.
   Mesmo período -> mesmo número nas 3 abas (Geral/Avançado/Base).
   ========================================================================= */
function _isoToday(){ return new Date().toISOString().slice(0,10); }
function _fmtISO(d){ return d.toISOString().slice(0,10); }
function _ymOf(iso){ return String(iso||"").slice(0,7); }

function rangeDoPreset(p){
  const hoje=new Date(); const y=hoje.getFullYear();
  let ini, fim=_isoToday();
  if(p==="hoje"){ ini=_isoToday(); }
  else if(p==="semana"){ const d=new Date(hoje); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); ini=_fmtISO(d); } // segunda desta semana
  else if(p==="mes"){ ini=`${y}-${String(hoje.getMonth()+1).padStart(2,"0")}-01`; }
  else if(p==="trimestre"){ const q=Math.floor(hoje.getMonth()/3); ini=`${y}-${String(q*3+1).padStart(2,"0")}-01`; }
  else if(p==="ano"){ ini=`${y}-01-01`; }
  else if(p==="mespassado"){
    const d=new Date(y, hoje.getMonth()-1, 1);
    ini=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
    const last=new Date(d.getFullYear(), d.getMonth()+1, 0);
    fim=_fmtISO(last);
  }
  else { ini=`${y}-01-01`; } // fallback = ano
  return {ini,fim};
}
function mesesNoRange(ini,fim){
  const sm=_ymOf(ini), em=_ymOf(fim);
  return (D.meses||[]).filter(ym=>(!sm||ym>=sm) && (!em||ym<=em));
}
function diasNoRange(ini,fim){
  const out=[]; if(!ini||!fim) return out;
  let d=new Date(ini+"T00:00:00"); const end=new Date(fim+"T00:00:00");
  while(d<=end){ out.push(_fmtISO(d)); d.setDate(d.getDate()+1); }
  return out;
}
// janela sub-mensal = começa e termina no MESMO mês (Hoje/Esta semana/Este mês curto)
// -> aí o número mensal seria grosseiro demais; usamos a base diária.
function subMensal(ini,fim){ return _ymOf(ini)===_ymOf(fim); }
// a fonte tem base diária utilizável?
function temDias(fonte){ const dd=(fonte||{}).dias; return dd && Object.keys(dd).length>0; }
// soma um campo da base diária dentro do range [ini,fim]
function somaDias(fonteDias, ini, fim, campo){
  let s=0, has=false;
  for(const dia of Object.keys(fonteDias||{})){
    if(dia>=ini && dia<=fim){ const v=(fonteDias[dia]||{})[campo];
      if(v!=null){ s+=Number(v); has=true; } }
  }
  return has?s:null;
}
// AGREGADOR de um campo numérico de uma fonte num RANGE EXPLÍCITO [ini,fim].
// Retorna null quando NÃO há nenhum dado no range (pra comparação mostrar "sem base").
function somaCampoFonteEm(fonte, campo, ini, fim){
  if(!ini||!fim) return null;
  if(subMensal(ini,fim) && temDias(fonte)){
    return somaDias(fonte.dias, ini, fim, campo);   // null se nenhum dia tem dado
  }
  let s=0, has=false;
  for(const ym of mesesNoRange(ini,fim)){ const m=okMes(fonte,ym); if(m&&m[campo]!=null){ s+=Number(m[campo]); has=true; } }
  return has?s:null;
}
// Valor do range ATIVO (0 quando vazio, pra exibição).
function somaCampoFonte(fonte, campo){
  const v=somaCampoFonteEm(fonte, campo, RANGE_ATIVO.ini, RANGE_ATIVO.fim);
  return v==null?0:v;
}
// ---- PERÍODO ANTERIOR EQUIVALENTE (pra "Comparar") ----
function _addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return _fmtISO(d); }
function _addMonths(iso,n){ const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+n); return _fmtISO(d); }
function _prevMonthSameDay(iso){
  const p=iso.split("-").map(Number); let py=p[0], pm=p[1]-1; if(pm<1){pm=12;py--;}
  const last=new Date(py,pm,0).getDate(); const day=Math.min(p[2],last);
  return py+"-"+String(pm).padStart(2,"0")+"-"+String(day).padStart(2,"0");
}
// Range do MESMO tamanho imediatamente anterior, conforme o preset ativo.
function rangeAnterior(){
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim; if(!ini||!fim) return null;
  const p=PERIODO_ATIVO||"";
  if(p==="hoje")   return {ini:_addDays(ini,-1), fim:_addDays(fim,-1)};
  if(p==="semana") return {ini:_addDays(ini,-7), fim:_addDays(fim,-7)};
  if(p==="trimestre") return {ini:_addMonths(ini,-3), fim:_addMonths(fim,-3)};
  if(p==="ano")    return {ini:_addMonths(ini,-12), fim:_addMonths(fim,-12)};
  if(p==="mespassado"){ const pm=_addMonths(ini,-1).slice(0,7); return _monthBounds(pm); }
  if(p==="mes" || p.indexOf("mes:")===0) return {ini:_prevMonthSameDay(ini), fim:_prevMonthSameDay(fim)};
  // PERSONALIZADO: se o range cabe num único mês, compara com o MÊS ANTERIOR
  // (mês inteiro -> mês anterior inteiro = igual ao "Mês passado"; parcial -> mesmo span).
  if(_ymOf(ini)===_ymOf(fim)){
    const pp=ini.split("-"), lastDay=new Date(Number(pp[0]),Number(pp[1]),0).getDate();
    const cheio = (ini.slice(8)==="01" && Number(fim.slice(8))===lastDay);
    if(cheio){ const pm=_addMonths(ini,-1).slice(0,7); return _monthBounds(pm); }
    return {ini:_prevMonthSameDay(ini), fim:_prevMonthSameDay(fim)};
  }
  // range que cruza meses: desloca pela duração em dias (período do mesmo tamanho antes)
  const dur=Math.round((new Date(fim+"T00:00:00")-new Date(ini+"T00:00:00"))/86400000)+1;
  return {ini:_addDays(ini,-dur), fim:_addDays(fim,-dur)};
}

/* Tipos de campo:
   - kind: "num" (genérico) · "usd" (moeda) · "pct" · "int" · "text"
   - origem: "manual" (não tem fonte de API) · "falta" (dado faltando) ·
             "override" (tem valor automático que pode ser corrigido)
   opts: { id, kind, origem, auto, placeholder, width, suffix } */
function mfFormatAuto(auto, kind){
  if(auto==null||auto==="") return "";
  if(kind==="usd"){ const n=Number(String(auto).replace(/[^0-9.\-]/g,"")); return isNaN(n)?String(auto):n; }
  return auto;
}
function mField(opts){
  const id = opts.id;
  const kind = opts.kind || "num";
  const origem = opts.origem || "manual";
  MF_REGISTRO.push(id);
  const saved = mfGet(id);
  const autoVal = (opts.auto!=null) ? String(mfFormatAuto(opts.auto,kind)) : "";
  const isSet = (saved!=null && saved!=="");
  // valor exibido: manual salvo vence; senão valor automático (override); senão vazio
  const shown = isSet ? saved : autoVal;
  const wcls = opts.width ? (" mf-w-"+opts.width) : "";
  const ncls = (kind==="text") ? "" : " mf-num";
  const inpMode = (kind==="usd"||kind==="num"||kind==="int"||kind==="pct") ? "decimal" : "text";
  const ph = opts.placeholder || (kind==="usd" ? "0,00" : (kind==="pct" ? "0%" : (kind==="text" ? "digite…" : "0")));
  let tag = "";
  if(origem==="manual"){ tag = `<span class="mf-tag mf-tag-manual" title="Valor manual por natureza (sem fonte de API)">manual</span>`; }
  else if(origem==="falta"){ tag = `<span class="mf-tag mf-tag-falta" title="Dado faltando na fonte — preencha à mão">falta dado</span>`; }
  // override: a etiqueta "ajustado" só aparece quando o usuário edita (via wire)
  const setCls = isSet ? " is-set" : "";
  const adjTag = (origem==="override" && isSet)
    ? `<span class="mf-tag mf-tag-ajustado" title="Valor automático ajustado manualmente">ajustado</span>` : "";
  // EXIBIÇÃO AUTOMÁTICA (sem aparência de editável): mostra o número/valor
  // automático formatado. Sem fonte → placeholder discreto, nunca input.
  const sfx = opts.suffix ? `<span class="muted" style="font-size:12px"> ${opts.suffix}</span>` : "";
  if(shown!=null && shown!==""){
    let out;
    if(kind==="usd"){ const n=Number(String(shown).replace(/[^0-9.\-]/g,"")); out=isNaN(n)?String(shown):fusd(n); }
    else if(kind==="pct"){ const n=Number(String(shown).replace(/[^0-9.\-]/g,"")); out=isNaN(n)?String(shown):fpct(n); }
    else if(kind==="int"||kind==="num"){ const n=Number(String(shown).replace(/[^0-9.\-]/g,"")); out=isNaN(n)?String(shown):fi(n); }
    else { out=String(shown); }
    return `<span data-mfwrap="${id}">${out}${sfx}</span>`;
  }
  // dado faltando / manual sem valor: como era antes (marcador discreto)
  const lbl = (origem==="falta") ? "sem dado" : "—";
  return `<span class="muted" data-mfwrap="${id}">${lbl}</span>`;
}

/* Campo de TEXTO longo editável (próximos passos, observações, interpretações).
   Usa contenteditable pra fluir como texto corrido; default = conteúdo

/* Conecta os listeners depois de cada re-render. Salva no input, marca
   visualmente "ajustado" quando um override é editado, e recalcula deltas
   que dependam do valor manual (via callback opcional global). */
function wireMFields(){
  document.querySelectorAll(".mf-input:not(.mf-edit)").forEach(inp=>{
    if(inp.dataset.mfwired) return;
    inp.dataset.mfwired = "1";
    const id = inp.dataset.mfid;
    const origem = inp.dataset.mforigem;
    const apply = ()=>{
      const v = inp.value.trim();
      mfSet(id, v);
      const wrap = inp.closest(".mf");
      const isSet = (v!=="");
      if(wrap){ wrap.classList.toggle("is-set", isSet);
        // etiqueta "ajustado" para overrides editados
        if(origem==="override"){
          let t = wrap.querySelector(".mf-tag-ajustado");
          if(isSet && String(v)!==String(inp.dataset.mfauto||"")){
            if(!t){ t=document.createElement("span");
              t.className="mf-tag mf-tag-ajustado";
              t.title="Valor automático ajustado manualmente";
              t.textContent="ajustado"; wrap.appendChild(t); }
          } else if(t){ t.remove(); }
        }
      }
    };
    inp.addEventListener("input", apply);
    inp.addEventListener("change", apply);
  });
  // campos de texto longo (contenteditable)
  document.querySelectorAll(".mf-edit").forEach(ed=>{
    if(ed.dataset.mfwired) return;
    ed.dataset.mfwired = "1";
    const id = ed.dataset.mfid;
    const def = ed.dataset.mfdef || "";
    const apply = ()=>{
      const v = ed.textContent.trim();
      // só persiste se difere do default (evita salvar o placeholder)
      mfSet(id, (v===def ? "" : v));
      const wrap = ed.closest(".mf");
      if(wrap) wrap.classList.toggle("is-set", v!=="" && v!==def);
    };
    ed.addEventListener("input", apply);
    ed.addEventListener("blur", apply);
  });
}

/* =========================================================================
   COMPARAÇÃO COM PERÍODO ANTERIOR (AJUSTE 1)
   -------------------------------------------------------------------------
   delta(atual, anterior, menorEhMelhor) -> selo HTML pronto (seta + %),
   verde = positivo / vermelho = negativo / cinza = sem base.
   Para métricas de CUSTO/PERDA (CPL, CPC, CAC, perdidos, valor perdido…),
   passar menorEhMelhor=true: uma QUEDA vira verde e uma ALTA vira vermelho.
   O conjunto MENOR_E_MELHOR documenta quais chaves invertem a avaliação.
   ========================================================================= */
const MENOR_E_MELHOR = new Set([
  "cpl","cpc","cac","custo_por_lead","custo_por_clique","custo",
  "perdidos","lost","valor_perdido","posicao","position","cpl_meta"
]);

// formata a variação absoluta de forma compacta (mesmo formatador do número)
function fmtAbs(v, fmt){
  const f = fmt || fi;
  const sinal = v>0 ? "+" : (v<0 ? "−" : "");
  return sinal + f(Math.abs(v));
}

// delta(atual, anterior, menorEhMelhor=false, fmtAbsFn=fi)
function delta(atual, anterior, menorEhMelhor, fmtAbsFn){
  // sem base de comparação -> selo cinza "sem base", nunca inventa variação
  if(atual==null || anterior==null || isNaN(atual) || isNaN(anterior)){
    return `<span class="delta flat" title="Período anterior sem dado para comparar">${ico("minus","#6b7280",12)} sem base</span>`;
  }
  if(anterior===0){
    if(atual===0) return `<span class="delta flat">${ico("minus","#6b7280",12)} 0%</span>`;
    // crescimento a partir de zero: variação % indefinida -> mostra "novo"
    const positivo = menorEhMelhor ? false : true;
    const cls = positivo ? "up" : "down";
    const seta = positivo ? "trendingUp" : "trendingDown";
    const cor = positivo ? "#15803d" : "#b91c1c";
    const abs = (fmtAbsFn||fi)(atual);
    return `<span class="delta ${cls}" title="Período anterior era 0">${ico(seta,cor,12)} novo <span class="dabs">(+${abs} · vs 0)</span></span>`;
  }
  const diff = atual - anterior;
  const pct = 100*diff/Math.abs(anterior);
  const subiu = diff>0;
  // avaliação: para menorEhMelhor, descer é bom
  const bom = menorEhMelhor ? (diff<0) : (diff>0);
  const neutro = diff===0;
  let cls, seta, cor;
  if(neutro){ cls="flat"; seta="minus"; cor="#6b7280"; }
  else if(bom){ cls="up"; seta=subiu?"trendingUp":"trendingDown"; cor="#15803d"; }
  else { cls="down"; seta=subiu?"trendingUp":"trendingDown"; cor="#b91c1c"; }
  const pctTxt = (pct>0?"+":(pct<0?"−":""))+Math.abs(pct).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
  const absTxt = fmtAbs(diff, fmtAbsFn||fi);
  const antTxt = (fmtAbsFn||fi)(anterior);
  const tip = `Atual: ${(fmtAbsFn||fi)(atual)} · Anterior: ${antTxt} · Δ ${absTxt}`
    + (menorEhMelhor?" · (menor é melhor)":"");
  return `<span class="delta ${cls}" title="${tip}">${ico(seta,cor,12)} ${pctTxt} <span class="dabs">(${absTxt} · vs ${antTxt})</span></span>`;
}

/* Helpers de valor REAL do último mês e do mês anterior (fonte mensal). */
function ultMesIdx(o){ const ms=mesesAtivos(); for(let i=ms.length-1;i>=0;i--){ if(okMes(o,ms[i])) return i; } return -1; }
function valMes(o, idx, f){ const ms=mesesAtivos(); if(idx<0||idx>=ms.length) return null; const m=okMes(o,ms[idx]); return (m&&m[f]!=null)?Number(m[f]):null; }
// par [atual, anterior] do último mês com dado vs o mês imediatamente anterior com dado
function parUltAnt(o, f){
  const iu=ultMesIdx(o); if(iu<0) return [null,null];
  const ms=mesesAtivos();
  let ia=-1; for(let i=iu-1;i>=0;i--){ if(okMes(o,ms[i])){ia=i;break;} }
  return [valMes(o,iu,f), valMes(o,ia,f)];
}
// delta de um campo de uma fonte (meta_ads/google_ads/crm/ga4): valor no range ATIVO
// vs valor no range ANTERIOR EQUIVALENTE (Este mês jun → mesmo span de maio, etc.)
function deltaMes(o, f, menorEhMelhor, fmtAbsFn){
  const atual = somaCampoFonteEm(o, f, RANGE_ATIVO.ini, RANGE_ATIVO.fim);
  const pr = rangeAnterior();
  const ant = pr ? somaCampoFonteEm(o, f, pr.ini, pr.fim) : null;
  return delta(atual, ant, !!menorEhMelhor, fmtAbsFn);
}
// delta de um reference_key orgânico (último mês ok vs mês ok anterior)
function orgParUltAnt(key){
  const oks=[];
  for(const ym of mesesAtivos()){ const md=((D.organico||{}).meses||{})[ym];
    if(md&&md.status==="ok"){ let v=null;
      for(const ind of (md.indicadores||[])){ if(ind.reference_key===key && ind.status==="ok" && ind.valor!=null) v=Number(ind.valor); }
      oks.push(v); } }
  if(!oks.length) return [null,null];
  const a=oks[oks.length-1], b=oks.length>=2?oks[oks.length-2]:null;
  return [a,b];
}
function orgDelta(key, menorEhMelhor, fmtAbsFn){
  const atual = orgPeriodo(key);
  const pr = rangeAnterior();
  const ant = pr ? comRange(pr, ()=>orgPeriodo(key)) : null;

// delta de uma chave de stories (último mês ok vs mês ok anterior)
function stoSerie(key){
  const out=[];
  for(const ym of mesesAtivos()){ const md=((D.stories||{}).meses||{})[ym];

function stoDelta(key, menorEhMelhor){

// LEADS POR FONTE (familia por keyword no source) — soma meses[].por_fonte na
// janela visivel. Devolve {familia:{leads,won,valor_won}}. Granularidade mensal.
const FONTE_ORDEM_JS=["Google","Meta","Site","Ligação","Orgânico","Indicação","Recorrente","Outro","Sem origem"];
const FONTE_COR_JS={"Google":"#4B7BF5","Meta":"#9DB8FF","Site":"#7C5CFC","Ligação":"#16a34a","Orgânico":"#22b07d","Indicação":"#F59E0B","Recorrente":"#FF7A45","Outro":"#9aa0a6","Sem origem":"#c2c7cc"};
function crmPorFonte(){
  const out={}; const ms=mesesAtivos();
  (ms||[]).forEach(m=>{
    const pf=(((D.crm||{}).meses||{})[m]||{}).por_fonte||{};
    Object.keys(pf).forEach(f=>{

      o.leads+=Number(pf[f].leads||0); o.won+=Number(pf[f].won||0); o.valor_won+=Number(pf[f].valor_won||0);
    });
  });
  return out;
}
function crmPorFonteLista(){
  const pf=crmPorFonte();

    .sort((a,b)=>{const ia=FONTE_ORDEM_JS.indexOf(a.fonte),ib=FONTE_ORDEM_JS.indexOf(b.fonte);
      return (ia<0?99:ia)-(ib<0?99:ib) || b.leads-a.leads;});

// GANHOS (negócios WON) dentro do RANGE_ATIVO, filtrando por data_ganho — mesma
// ideia do somaDias (range explícito de datas ISO). filtroBucket (opcional):
// "trafego" | "organico" | "outro" — null/ausente devolve TODOS os ganhos.
// É a fonte PERÍODO-AWARE da "Receita do tráfego pago": somar `valor` dos itens
// trafego no range bate com o card (e a soma dos 3 baldes == receita fechada CRM).
function ganhosNoRange(filtroBucket){
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  const lista=(((D.crm||{}).ganhos)||[]);
  if(!ini||!fim) return [];
  return lista.filter(g=>{
    const d=g&&g.data_ganho; if(!d) return false;
    if(!(d>=ini && d<=fim)) return false;
    if(filtroBucket && g.bucket!==filtroBucket) return false;
    return true;
  });
}
function receitaGanhosRange(filtroBucket){
  return ganhosNoRange(filtroBucket).reduce((a,g)=>a+Number(g.valor||0),0);
}
// soma MENSAL pura (sem base diária) — usada como fallback multi-mês.
function sumOrgMensal(key){
  let s=0, has=false;
  for(const ym of mesesAtivos()){
    const md=((D.organico||{}).meses||{})[ym];
    if(md&&md.status==="ok"){
      for(const ind of (md.indicadores||[])){
        if(ind.reference_key===key && ind.status==="ok" && ind.valor!=null){
          s+=Number(ind.valor); has=true;
        }
      }
    }
  }
  return has?s:null;
}
// AGREGADOR UNIVERSAL do orgânico (igual somaCampoFonte das outras fontes):
// janela sub-mensal + base diária -> usa o dia; senão soma os meses. Respeita o kind.
function sumOrg(key){
  if(orgSubMensal()){
    const k=orgKindOf(key);
    if(k==="add"){
      const v=orgSomaDias(key); if(v!=null) return v;
      // range coberto pela coleta diária cheia + métrica ausente = 0 REAL na janela
      // (não cai pro total mensal, que superestimaria a janela curta). MAS só vale
      // pra métrica que DE FATO participa da coleta diária — métrica mensal-pura
      // (Pinterest/YouTube em quem só tem agregado mensal) cai pro mês, senão sumiria
      // zerada em preset sub-mensal. O aviso "indicadores mensais nesta janela" cobre.
      if(orgRangeCoberto() && orgMetricaDiaria(key)) return 0;
    }
    else if(k==="unique"||k==="avg"){ const v=orgRangePreset(key); if(v!=null) return v; }
    else if(k==="stock"){ const v=orgUltDia(key); if(v!=null) return v; }
    // sem base diária utilizável no range -> cai pro mensal (último recurso)
  }
  return sumOrgMensal(key);
}
function sumStories(key){
  let s=0, has=false;
  for(const ym of mesesAtivos()){
    const v=stoVal(ym,key);
    if(v!=null){ s+=v; has=true; }
  }
  return has?s:null;
}
function sumGscList(kind, field){
  const obj=((D.gsc||{})[kind]||{})[kind]||[];
  if(!obj.length) return null;
  return obj.reduce((a,x)=>a+Number(x[field]||0),0);
}

function orgUlt(key){
  const ms=mesesAtivos();
  for(let i=ms.length-1;i>=0;i--){ const ym=ms[i]; const md=((D.organico||{}).meses||{})[ym];
    if(md && md.status==="ok"){ for(const ind of (md.indicadores||[])){ if(ind.reference_key===key && ind.status==="ok" && ind.valor!=null) return Number(ind.valor); } } }
  return null;
}
// REGRA "tudo conectado com dado aparece": rede tem dado em QUALQUER mês coletado?
function redeTemDadoAlgum(r){
  const keys=[r&&r.big&&r.big.refkey, r&&r.sec&&r.sec.refkey].filter(Boolean);
  const meses=((D.organico||{}).meses)||{};
  for(const ym in meses){ const md=meses[ym];
    if(md && md.status==="ok"){ for(const ind of (md.indicadores||[])){
      if(keys.indexOf(ind.reference_key)>=0 && ind.status==="ok" && ind.valor!=null) return true; } } }
  return false;
}

/* =========================================================================
   ORGANICO DIARIO — agora o orgânico tem base por dia (organico.dias/series/ranges),
   igual Meta/Google/CRM/GA4. Roteamento por KIND da métrica:
     add    -> soma a base diária no range (sub-mensal) ou os meses (multi-mês).
     unique -> alcance DEDUPLICADO: usa o agregado EXATO do preset (organico.ranges),
               nunca a soma dos dias (que superestima). Sem preset -> mensal.
     stock  -> snapshot: último dia do range (se houver) ou último mês.
     avg    -> média: agregado exato do preset (ranges) ou último mês; nunca soma.
   ========================================================================= */
function orgKindOf(refkey){
  const k=((D.organico||{}).kind||{})[refkey];
  return k || "add";          // default seguro = aditivo (mesma semântica do antigo flow)
}
// a fonte orgânica tem base diária utilizável dentro do range ativo?
function orgTemDias(refkey){
  const dd=(D.organico||{}).dias||{};
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  if(!ini||!fim) return false;
  for(const dia of Object.keys(dd)){
    if(dia>=ini && dia<=fim && dd[dia] && dd[dia][refkey]!=null) return true;
  }
  return false;
}
// a métrica PARTICIPA da coleta diária? (tem datapoint diário em ALGUM dia, em qualquer
// lugar: organico.dias OU organico.series). Distingue métrica diária com buraco no range
// (ex.: IG/FB reach, ou Pinterest no Wolf que vem dia-a-dia) de métrica MENSAL-PURA
// (ex.: Pinterest/YouTube no Marcelo, que só existem no agregado mensal). A 1ª, ausente
// no range coberto, vale 0 real; a 2ª deve cair pro mês — não some zerada na janela curta.
const _ORG_DAILY_METRICS = (function(){
  const set=new Set();
  const dd=(D.organico||{}).dias||{};
  for(const dia of Object.keys(dd)){ const row=dd[dia]; if(row) for(const k of Object.keys(row)) set.add(k); }
  // series over_time são indexadas pela refkey-base da própria métrica (ex.: ig:reach)
  for(const base of Object.keys((D.organico||{}).series||{})) set.add(base);
  return set;
})();
function orgMetricaDiaria(refkey){ return _ORG_DAILY_METRICS.has(refkey); }
// soma a série diária de uma métrica no range ativo (só faz sentido pra "add")
function orgSomaDias(refkey){
  const dd=(D.organico||{}).dias||{};
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  let s=0,has=false;
  for(const dia of Object.keys(dd)){
    if(dia>=ini && dia<=fim){ const v=(dd[dia]||{})[refkey];
      if(v!=null){ s+=Number(v); has=true; } }
  }
  return has?s:null;
}
// último valor diário dentro do range (estoque corrente) — pra "stock"
function orgUltDia(refkey){
  const dd=(D.organico||{}).dias||{};
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  let best=null,bestv=null;
  for(const dia of Object.keys(dd)){
    if(dia>=ini && dia<=fim){ const v=(dd[dia]||{})[refkey];
      if(v!=null && (best===null || dia>best)){ best=dia; bestv=Number(v); } }
  }
  return bestv;
}
// agregado EXATO do preset ativo (organico.ranges) p/ unique/avg — casa ini/fim do range.
function orgRangePreset(refkey){
  const rg=(D.organico||{}).ranges||{};
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  // 1) match exato por datas (robusto a deslocamento de "hoje")
  for(const nome of Object.keys(rg)){
    const blk=rg[nome];
    if(blk && blk.ini===ini && blk.fim===fim && blk.valores && blk.valores[refkey]!=null)
      return Number(blk.valores[refkey]);
  }
  // 2) match pelo nome do preset ativo
  const blk=rg[PERIODO_ATIVO];
  if(blk && blk.valores && blk.valores[refkey]!=null) return Number(blk.valores[refkey]);
  return null;
}
// a janela ativa é sub-mensal (Hoje/Esta semana/Este mês curto)?
function orgSubMensal(){
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  return ini && fim && subMensal(ini,fim);
}
// a janela cobre um MÊS CALENDÁRIO INTEIRO (1 ao último dia)? Aí o total mensal é o
// valor CERTO — nada de aviso "ainda mensal" (ex.: preset "Mês passado").
function orgMesInteiro(){
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  if(!ini||!fim||!subMensal(ini,fim)) return false;
  if(ini.slice(8,10)!=="01") return false;
  const y=+ini.slice(0,4), m=+ini.slice(5,7);
  const ultDia=new Date(y, m, 0).getDate();         // último dia do mês
  return +fim.slice(8,10)===ultDia;
}
// o range ativo está coberto pela coleta diária COMPLETA (batelada multi-métrica)?
// Distingue dia "cheio" (range-pull de todas as keys, mês corrente) de dia que só veio
// da série over_time (1 métrica, ex.: ig:reach em meses passados). Coberto => métrica
// aditiva AUSENTE no range = 0 real (não cai pro mensal, que superestimaria). Cobre
// métrica esparsa tipo TikTok que só reportou 1 dia no mês.
const _OT_ONLY_KEYS = new Set(Object.values((D.organico||{}).series||{}).map(s=>s.refkey?s.refkey:null).concat(["ig:reach","fb:page_reach_total"]));
function _diaCheio(row){
  if(!row) return false;
  for(const k of Object.keys(row)){ if(!_OT_ONLY_KEYS.has(k)) return true; } // tem key fora do over_time
  return false;
}
function orgRangeCoberto(){
  const dd=(D.organico||{}).dias||{};
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  if(!ini||!fim) return false;
  for(const dia of Object.keys(dd)){ if(dia>=ini && dia<=fim && _diaCheio(dd[dia])) return true; }
  return false;
}
// uma métrica orgânica ficou SÓ mensal nesta janela? (pra decidir o aviso)
// add com dias no range -> não; unique/avg com preset -> não; senão (sub-mensal sem base) -> sim.
function orgSoMensal(refkey){
  if(!orgSubMensal()) return false;                 // multi-mês usa mensal por definição, sem aviso
  const k=orgKindOf(refkey);
  // aditiva: tem dia no range -> diária. range coberto SÓ vale como diária se a métrica
  // realmente participa da coleta diária (senão é mensal-pura nesta janela -> avisa).
  if(k==="add"   && (orgTemDias(refkey) || (orgRangeCoberto() && orgMetricaDiaria(refkey)))) return false;
  if(k==="stock" && orgUltDia(refkey)!=null) return false;
  if((k==="unique"||k==="avg") && orgRangePreset(refkey)!=null) return false;
  return true;                                       // sub-mensal e sem base diária utilizável
}

function nz(n){ return (n==null || isNaN(n)) ? 0 : Number(n); }
function somaExistente(...vals){
  const ok=vals.some(v=>v!=null && !isNaN(v));
  return ok ? vals.reduce((a,v)=>a+nz(v),0) : null;
}

function calcFunilMkt(){
  const impMeta=sumMeta("impressions"), impGads=sumGads("impressions");
  const reachIg=orgUlt("ig:reach"), reachFb=orgUlt("fb:page_reach_total");
  const clkMeta=sumMeta("clicks"), clkGads=sumGads("clicks");
  const leadsMeta=sumMeta("leads");
  const novosCrm=sumCrm("novos_leads"), estimateCrm=sumCrm("orcamentos_estimate");
  const fechadosCrm=sumCrm("fechados"), valorFechado=sumCrm("valor_fechado");
  return {
    tofu:{total:impMeta+impGads, det:[
      {k:"Impressões Meta Ads",v:impMeta,fmt:fi},
      {k:"Impressões Google Ads",v:impGads,fmt:fi},
      {k:"Alcance Instagram (últ. mês)",v:reachIg,fmt:fi},
      {k:"Alcance Facebook (últ. mês)",v:reachFb,fmt:fi}]},
    mofu:{total:clkMeta+clkGads, det:[
      {k:"Cliques Meta Ads",v:clkMeta,fmt:fi},
      {k:"Cliques Google Ads",v:clkGads,fmt:fi},
      {k:"Leads de formulário (Meta)",v:leadsMeta,fmt:fi}]},
    bofu:{total:novosCrm, det:[
      {k:"Novos leads no CRM",v:novosCrm,fmt:fi},
      {k:"Orçamentos/Estimates",v:estimateCrm,fmt:fi},
      {k:"Negócios fechados",v:fechadosCrm,fmt:fi},
      {k:"Valor fechado",v:valorFechado,fmt:fusd}]},
    extra:{fechadosCrm}
  };
}

function renderFunis3(container){
  const wrap=el("div","");

  const funis=calcFunis3();

  const pr=rangeAnterior();
  const funisAnt = pr ? comRange(pr, ()=>calcFunis3()) : null;

function buildFunilCol(f, fAnt){
  const col=el("div","fcol");
  col.innerHTML=`<div class="fc-head">
      <div class="fc-titulo">${ico(f.icone,LARANJA,18)} ${f.titulo}</div>
      <span class="fc-badge">API</span>
    </div>
    <div class="fc-sub">${f.sub}</div>`;
  const fm=el("div","funilmini");
  const convTM=f.topo.num&&f.meio.num!=null?(100*f.meio.num/f.topo.num):null;
  const convML=f.meio.num&&f.fundo.num!=null?(100*f.fundo.num/f.meio.num):null;
  const convLV=f.fundo.num&&f.venda&&f.venda.num!=null?(100*f.venda.num/f.fundo.num):null;
  fm.appendChild(funilStage(f,"topo","1","fmw1",fAnt));
  fm.appendChild(el("div","fconv","↓ "+fpct(convTM)+" Topo→Meio"));
  fm.appendChild(funilStage(f,"meio","2","fmw2",fAnt));
  fm.appendChild(el("div","fconv","↓ "+fpct(convML)+" Meio→Leads"));
  fm.appendChild(funilStage(f,"fundo","3","fmw3",fAnt));
  fm.appendChild(el("div","fconv","↓ "+fpct(convLV)+" Leads→Vendas"));
  fm.appendChild(funilStage(f,"venda","4","fmw4",fAnt));
  col.appendChild(fm);
  return col;
}

function funilStage(f,etapa,tom,wcls,fAnt){
  const seg=f[etapa];
  const ant = (fAnt && fAnt[etapa]) ? fAnt[etapa].num : null;
  const s=el("div",`fmstage ${f.paleta}-t${tom} ${wcls}`);
  s.innerHTML=`<div><div class="fm-cap">${seg.cap}</div>
    <div class="fm-num">${fi(seg.num)}</div>
    <div class="fm-sub">${seg.sub}</div>
    <div class="delta-row fm-delta">${delta(seg.num, ant)}</div></div>`;
  s.onclick=()=>drillFunil3(f,etapa);
  s.onmousemove=(e)=>tipFunil3(e,f,etapa);
  s.onmouseleave=hideTip;
  return s;
}

function convEntreEtapas(f,etapa){
  if(etapa==="topo") return null;
  if(etapa==="meio") return f.topo.num&&f.meio.num!=null?(100*f.meio.num/f.topo.num):null;
  if(etapa==="fundo") return f.meio.num&&f.fundo.num!=null?(100*f.fundo.num/f.meio.num):null;
  return f.fundo.num&&f.venda&&f.venda.num!=null?(100*f.venda.num/f.fundo.num):null;
}

function tipFunil3(e,f,etapa){
  const seg=f[etapa];

  for(const d of seg.det){ h+=`<div class="row"><span>${d.k}</span><b>${fi(d.v)}</b></div>`; }
  if(seg.fonte){ h+=`<div style="margin-top:7px;padding-top:7px;border-top:1px dashed var(--linha);font-size:11.5px;line-height:1.4"><span style="color:var(--laranja2);font-weight:700;display:inline-flex;align-items:center;gap:5px">${ico("mapPin","var(--laranja2)",14)}De onde vem o dado</span><br><span class="muted">${seg.fonte}</span></div>`; }

function calcCrmFunis(){
  const snap=(((D.crm||{}).snapshot||{}).por_estagio||[]);
  const totalSnap=snap.reduce((a,s)=>a+Number(s.qtd||0),0);
  const won=sumCrm("fechados"), lost=sumCrm("perdidos"), novos=sumCrm("novos_leads");
  const valorGanho=sumCrm("valor_fechado"), valorPerdido=sumCrm("valor_perdido");
  const wonStages=snap.filter(s=>String(s.stage||"").includes("FECHADO"));
  const lostStages=snap.filter(s=>String(s.stage||"").includes("PERDIDO")||String(s.stage||"").includes("SCAM"));
  const valorAberto=snap
    .filter(s=>!String(s.stage||"").includes("FECHADO")&&!String(s.stage||"").includes("PERDIDO")&&!String(s.stage||"").includes("SCAM"))
    .reduce((a,s)=>a+Number(s.valor||0),0);
  const aberto=snap
    .filter(s=>!String(s.stage||"").includes("FECHADO")&&!String(s.stage||"").includes("PERDIDO")&&!String(s.stage||"").includes("SCAM"))
    .reduce((a,s)=>a+Number(s.qtd||0),0);
  return {
    geral: {
    id:"crmgeral", titulo:"GHL GERAL", icone:"folder", cor:"#FF3B00",
    sub:"Pipeline mais ativo do GHL · todas as origens",
    fonte:"CRM GoHighLevel — pipeline NOVOS LEADS (todas as oportunidades)",
    etapas:snap.map((s,i)=>({nm:s.stage, q:Number(s.qtd||0), cor:["#FFA877","#FF8A5B","#FF7A45","#FF5A1F","#FF4D14","#16a34a","#2563eb","#0A0A0A"][i%8]})),
    won, lost, aberto,
    valor_ganho:valorGanho, valor_aberto:valorAberto, valor_perdido:valorPerdido,
    prev:{}
  },
  trafego: (()=>{
    // FUNIL DO TRÁFEGO PAGO consolidado por SOURCE no CRM (bucket "trafego"):
    // won via lista `ganhos` período-aware; perdidos via campos diários/mensais
    // `perdidos_trafego`; em aberto via snapshot `aberto_por_bucket.trafego`.
    const ganhosTraf=ganhosNoRange("trafego");
    const wonTraf=ganhosTraf.length;
    const valorGanhoTraf=ganhosTraf.reduce((a,g)=>a+Number(g.valor||0),0);
    const lostTraf=sumCrm("perdidos_trafego");
    const valorPerdidoTraf=sumCrm("valor_perdido_trafego");
    const leadsTraf=sumCrm("leads_trafego");
    const abTraf=(((D.crm||{}).aberto_por_bucket||{}).trafego)||{};
    const abertoTraf=Number(abTraf.qtd||0), valorAbertoTraf=Number(abTraf.valor||0);
    return {
    id:"crmtrafego", titulo:"LEADS TRÁFEGO", icone:"dollar", cor:"#2563eb",
    sub:"Mídia paga · funil consolidado por source no CRM",
    fonte:"Funil pago do CRM (GoHighLevel): leads, ganhos, perdidos e em aberto cujo source é de mídia paga (anúncio/site/ligação). Won via lista de ganhos por período; perdidos por data de status-change; em aberto = snapshot atual.",
    etapas:[
      {nm:"Leads Meta Ads", q:sumMeta("leads"), cor:"#9DB8FF"},
      {nm:"Conversões Google Ads", q:sumGads("conversoes"), cor:"#4B7BF5"},
      {nm:"Leads tráfego (CRM)", q:leadsTraf, cor:"#3B6FE0"},
      {nm:"Ganhos tráfego", q:wonTraf, cor:"#16a34a"}],
    won:wonTraf, lost:lostTraf, aberto:abertoTraf,
    valor_ganho:valorGanhoTraf, valor_aberto:valorAbertoTraf, valor_perdido:valorPerdidoTraf,
    // taxa do funil = ganhos de tráfego ÷ leads de tráfego (topo→ganho)
    leads_topo:leadsTraf,
    prev:{}
  };})()};
}

function buildCrmFunilCol(f){
  const col=el("div","card");
  col.style.borderTop=`3px solid ${f.cor}`;
  const nums=f.etapas.map(e=>e.q).filter(v=>v!=null&&!isNaN(v));
  const topo=nums.length?nums[0]:null, fundo=nums.length?nums[nums.length-1]:null;
  // Taxa: por padrão topo→último estágio do funil. Quando o funil declara leads_topo
  // (LEADS TRÁFEGO), a taxa é ganhos ÷ leads de tráfego (topo do funil pago → ganho).
  const temTaxaTopo=(f.leads_topo!=null);
  const taxa=temTaxaTopo
    ? (Number(f.leads_topo)>0 && f.won!=null ? 100*Number(f.won)/Number(f.leads_topo) : null)
    : (topo&&fundo!=null?100*fundo/topo:null);
  const taxaSub=temTaxaTopo?"leads tráfego → ganhos":"topo → último estágio disponível";
  col.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
      <span style="display:inline-flex;color:${f.cor}">${ico(f.icone,f.cor,18)}</span>
      <span style="font-weight:800;font-size:15px;letter-spacing:.3px">${f.titulo}</span>
      <span style="margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:#eafbe7;color:#15803d;border:1px solid #bfe9c9;padding:2px 8px;border-radius:999px">API</span></div>
    <div class="muted" style="margin-bottom:12px;font-size:12px">${f.sub}</div>`;
  // KPIs do funil: taxa conv · valor ganho · em aberto · ganho/perdido
  const pv=f.prev||{};
  const kp=el("div","grid g2"); kp.style.gap="9px"; kp.style.marginBottom="13px";
  kp.innerHTML=`
    <div class="kpi"><div class="k-lbl">Taxa de conversão</div><div class="k-val" style="color:${f.cor}">${taxa==null?"sem dado":fpct(taxa)}</div><div class="k-sub">${taxaSub}</div></div>
    <div class="kpi"><div class="k-lbl">Valor ganho</div><div class="k-val" style="color:var(--verde)">${f.valor_ganho==null?"sem dado":fusd(f.valor_ganho)}</div><div class="k-sub">${f.won==null?"sem dado":fi(f.won)+" negócios won"}</div></div>
    <div class="kpi"><div class="k-lbl">Na mesa (em aberto)</div><div class="k-val">${f.valor_aberto==null?"sem dado":fusd(f.valor_aberto)}</div><div class="k-sub">${f.aberto==null?"sem dado":fi(f.aberto)+" em negociação"}</div></div>
    <div class="kpi"><div class="k-lbl">Ganho / Perdido</div><div class="k-val"><span style="color:var(--verde)">${f.won==null?"—":fi(f.won)}</span> / <span style="color:var(--vermelho)">${f.lost==null?"—":fi(f.lost)}</span></div><div class="k-sub">perdido ${f.valor_perdido==null?"sem dado":fusd(f.valor_perdido)}</div></div>`;
  col.appendChild(kp);
  // barras do funil
  const ff=el("div","crmfunnel");
  const maxq=Math.max(...f.etapas.map(e=>Number(e.q||0)),1);
  f.etapas.forEach((s,i)=>{
    const q=s.q==null?null:Number(s.q||0);
    const w=q==null?22:Math.max(8,Math.round(100*q/maxq));
    const prevq=i>0?f.etapas[i-1].q:null;
    const convAnt=i>0&&q!=null&&prevq?100*q/prevq:null;
    const row=el("div","crow");
    row.innerHTML=`<div class="cname">${s.nm}</div>
      <div class="cbar" style="width:${w}%;background:${s.cor}">${q==null?"sem dado":fi(q)}</div>
      <div class="cmeta">${convAnt!=null?"↓ "+fpct(convAnt):""}</div>`;
    row.onmousemove=(e)=>{const t=document.getElementById("ftip");
      let h=`<div style="font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:6px">${ico(f.icone,"#fff",16)}<span>${f.titulo} · ${s.nm}</span></div>
        <div class="row"><span>Oportunidades</span><b>${q==null?"sem dado":fi(q)}</b></div>`;
      if(convAnt!=null) h+=`<div class="row"><span>Conversão da etapa anterior</span><b>${fpct(convAnt)}</b></div>`;
      h+=`<div style="margin-top:7px;padding-top:7px;border-top:1px dashed var(--linha);font-size:11.5px;line-height:1.4"><span style="color:var(--laranja2);font-weight:700;display:inline-flex;align-items:center;gap:5px">${ico("mapPin","var(--laranja2)",14)}De onde vem o dado</span><br><span class="muted">${f.fonte}</span></div>`;
      t.innerHTML=h; t.style.display="block";
      t.style.left=Math.min(e.clientX+14,window.innerWidth-310)+"px";t.style.top=(e.clientY+14)+"px";};
    row.onmouseleave=hideTip;
    ff.appendChild(row);
  });
  col.appendChild(ff);
  return col;
}

function buildLeadsPorFonteCard(){

      <span style="display:inline-flex;color:var(--laranja)">${ico("users","var(--laranja)",18)}</span>

// delta combinado de investimento (Meta+Google último mês vs anterior)
function deltaInvComb(){
  const R=RANGE_ATIVO;
  const atual=(somaCampoFonteEm(D.meta_ads,"spend",R.ini,R.fim)||0)
             +(somaCampoFonteEm(D.google_ads,"spend",R.ini,R.fim)||0);
  const pr=rangeAnterior(); let ant=null;
  if(pr){ const m=somaCampoFonteEm(D.meta_ads,"spend",pr.ini,pr.fim),
                g=somaCampoFonteEm(D.google_ads,"spend",pr.ini,pr.fim);
    if(m!=null||g!=null) ant=(m||0)+(g||0); }
  return delta(atual, ant, false, fusd);
}
// Roda fn() com o RANGE/MESES temporariamente trocados (pra deltas que reusam agregadores do range ativo).
function comRange(r, fn){
  const oi=RANGE_ATIVO, om=MESES_ATIVOS;
  RANGE_ATIVO={ini:r.ini, fim:r.fim}; MESES_ATIVOS=mesesNoRange(r.ini, r.fim);
  try{ return fn(); } finally { RANGE_ATIVO=oi; MESES_ATIVOS=om; }
}

/* Leads de TRÁFEGO no período (respeita o filtro).
   Reusa a classificação já existente: o fundo do funil TRÁFEGO
   (calcFunis3().trafego.fundo.num = Meta leads + Google conversões), que é
   calculado com sumMeta/sumGads e portanto respeita o RANGE_ATIVO.
   Retorna {num, fonte} pra o tooltip explicar de onde veio. */
function leadsTrafegoPeriodo(){
  let num=null, fonte="";
  try{
    const f=calcFunis3();
    if(f && f.trafego && f.trafego.fundo && f.trafego.fundo.num!=null){
      num=f.trafego.fundo.num;
      fonte="fundo do funil TRÁFEGO (leads Meta + conversões Google) no período";
    }
  }catch(e){}
  // fallback: soma direta Meta leads + Google conversões (mesma base, por período)
  if(num==null){
    const ml=sumMeta("leads")||0, gc=sumGads("conversoes")||0;
    if(ml||gc){ num=ml+gc; fonte="leads Meta Ads + conversões Google Ads no período"; }
  }
  return {num, fonte};
}

function indicadoresNegocioReais(){
  const investimento=sumMeta("spend")+sumGads("spend");
  const receita=sumCrm("valor_fechado");
  const fechados=sumCrm("fechados");
  const leads=sumCrm("novos_leads");
  const estimates=sumCrm("orcamentos_estimate");
  const snap=(((D.crm||{}).snapshot||{}).por_estagio||[]);
  const valorAberto=snap
    .filter(s=>!String(s.stage||"").includes("FECHADO")&&!String(s.stage||"").includes("PERDIDO")&&!String(s.stage||"").includes("SCAM"))
    .reduce((a,s)=>a+Number(s.valor||0),0);
  const lt=leadsTrafegoPeriodo();
  const leadsTraf=lt.num;
  // Receita do tráfego pago — PERÍODO-AWARE: soma do `valor` dos ganhos (status won)
  // com bucket "trafego" cuja data_ganho cai no RANGE_ATIVO (via ganhosNoRange). Antes
  // usava valor_won da atribuição (janela inteira coletada) e não batia com o período.
  // Fallback: se a coleta ainda não trouxe D.crm.ganhos, cai no bucket da atribuição.
  const at=(((D.crm||{}).avancado||{}).atribuicao||{});
  const rb=(at.resumo_bucket||{});
  const recTrafBucket=(rb.trafego||{});
  const temGanhos = Array.isArray(((D.crm||{}).ganhos));
  const ganhosTraf = temGanhos ? ganhosNoRange("trafego") : null;
  const receitaTrafego = temGanhos
    ? ganhosTraf.reduce((a,g)=>a+Number(g.valor||0),0)
    : ((recTrafBucket.valor_won!=null) ? Number(recTrafBucket.valor_won) : null);
  // nº de NEGÓCIOS GANHOS de tráfego no período (não nº de leads) — pro tooltip período-aware
  const ganhosTrafN = temGanhos ? ganhosTraf.length : null;
  const leadsTrafCrm=(recTrafBucket.leads!=null) ? Number(recTrafBucket.leads) : null;
  const atribPeriodo=(((D.crm||{}).avancado||{}).periodo||null);
  const receitaTrafegoPeriodAware = temGanhos;
  // custo total de aquisição (mídia + outros custos da aba CAC), por período
  const outros=cacTotalOutrosCustos();
  const midiaEf=cacMidiaEfetiva();
  const totalAquis=midiaEf+outros;
  return {
    investimento, receita, fechados, leads, estimates, valorAberto,
    leadsTraf, leadsTrafFonte:lt.fonte,
    receitaTrafego, leadsTrafCrm, atribPeriodo,
    ganhosTrafN, receitaTrafegoPeriodAware,
    outrosCustos:outros, midiaEfetiva:midiaEf, totalAquisicao:totalAquis,
    roas: investimento ? receita/investimento : null,
    roi: investimento ? 100*(receita-investimento)/investimento : null,
    custoLead: leads ? investimento/leads : null,
    custoEstimate: estimates ? investimento/estimates : null,
    custoFechado: fechados ? investimento/fechados : null,
    custoLeadTrafego: (leadsTraf!=null && leadsTraf>0) ? investimento/leadsTraf : null,
    cacMidia: fechados ? investimento/fechados : null,
    cacReal: fechados ? totalAquis/fechados : null,
    forecastPonderado: valorAberto ? valorAberto*0.3 : null
  };
}

/* =========================================================================
   ABA CAC — render
   -------------------------------------------------------------------------
   Cabeçalho explicativo + linhas de custo editáveis (mídia auto + manuais +
   linhas livres "Outro custo") + bloco de cálculo (total, fechados, CAC real
   e CAC só de mídia) + breakdown visual (% de cada custo no total).
   Persistência via cacGet/cacSet por período. Re-renderiza ao trocar período.
   ========================================================================= */
function cacLinhaInput(id, autoVal){
  // autoVal != null -> linha de mídia com valor automático (override)
  const saved=cacGet(id);
  const isSet=(saved!=null && saved!=="");
  let shown;
  if(isSet){ shown=saved; }
  else if(autoVal!=null){ const a=Number(autoVal); shown=isNaN(a)?"":(Math.round(a*100)/100); }
  else { shown=""; }
  const auto = (autoVal!=null) ? (Math.round(Number(autoVal)*100)/100) : "";
  return `<input class="cac-inp${isSet?" is-set":""}" inputmode="decimal" data-cacid="${id}" `
    + `data-cacauto="${auto}" value="${shown===""?"":shown}" placeholder="0,00" `
    + `aria-label="custo">`;
}
function renderCac(){
  const host=document.getElementById("cac-content");
  if(!host) return;
  host.innerHTML="";
  const n=indicadoresNegocioReais();
  const midiaAuto=cacMidiaAuto();
  const midiaEf=cacMidiaEfetiva();
  const outros=cacTotalOutrosCustos();
  const total=midiaEf+outros;
  const fech=sumCrm("fechados");
  const cacReal = fech>0 ? total/fech : null;
  const cacMidia = fech>0 ? midiaEf/fech : null;

  // cabeçalho explicativo
  const intro=el("div","cac-intro");
  intro.innerHTML=`<span class="ci-ic">${ico("wallet","var(--laranja)",22)}</span>
    <div><div class="ci-t">Custo de Aquisição de Cliente (CAC) — outros custos além da mídia</div>
    <div class="ci-d">Aqui você cadastra os custos de aquisição que <b>não aparecem nas APIs</b> — salários, ferramentas, comissões, taxas operacionais. Somados ao gasto de mídia (Meta + Google), eles formam o <b>CAC real</b>, não só o publicitário. Os valores são salvos por período (mês/trimestre/ano selecionado lá em cima) e alimentam o card <b>CAC real</b> da aba Avançado.</div></div>`;
  host.appendChild(intro);

  // ---- linhas de custo (editáveis) ----

  sec1.appendChild(secHead("calculator","Custos de aquisição do período","mídia automática + custos manuais"));
  const grid=el("div","cac-grid");
  // mídia (auto/override)
  for(const c of CAC_CUSTOS){

    const isSet=(cacGet(c.id)!=null && cacGet(c.id)!=="");
    let tag;
    if(isAuto){ tag = isSet ? `<span class="cac-tag over">ajustado</span>` : `<span class="cac-tag auto">automático</span>`; }
    else { tag = `<span class="cac-tag man">manual</span>`; }
    const desc = isAuto
      ? `${c.desc} · pré-preenchido com ${fusd(midiaAuto)} (editável)`
      : c.desc;
    const row=el("div","cac-row"+(isAuto?" is-auto":""));
    row.innerHTML=`<div class="cr-info"><div class="cr-lbl">${c.lbl} ${tag}</div><div class="cr-desc">${desc}</div></div>
      <span class="cac-cur">${simMoeda()}</span>${cacLinhaInput(c.id, isAuto?midiaAuto:null)}<span style="width:30px"></span>`;
    grid.appendChild(row);
  }
  // linhas livres "Outro custo"
  const all=cacLoadAll();
  const outroIds=Object.keys(all).filter(k=>/^cac_outro_\d+$/.test(k)).sort((a,b)=>{
    return Number(a.split("_").pop())-Number(b.split("_").pop());
  });
  for(const id of outroIds){
    const lbl=all[id+"_lbl"]||"Outro custo";
    const row=el("div","cac-row");
    row.innerHTML=`<div class="cr-info"><div class="cr-lbl">
        <input class="cac-inp" style="width:auto;min-width:160px;text-align:left;font-size:13px" data-caclbl="${id}" value="${escTxt(lbl)}" placeholder="nome do custo…">
        <span class="cac-tag man">manual</span></div><div class="cr-desc">custo livre de aquisição</div></div>
      <span class="cac-cur">${simMoeda()}</span>${cacLinhaInput(id, null)}
      <button class="cac-del" data-cacdel="${id}" title="Remover este custo">${ico("trash","currentColor",15)}</button>`;
    grid.appendChild(row);
  }
  sec1.appendChild(grid);
  // ações: adicionar linha + limpar
  const bar=el("div","cac-bar");
  bar.innerHTML=`<button class="cac-addbtn" id="cac-add">${ico("plus","currentColor",15)} Adicionar outro custo</button>
    <button class="cac-clear" id="cac-clear">${ico("eraser","currentColor",14)} Limpar custos do período</button>`;
  sec1.appendChild(bar);
  host.appendChild(sec1);

  // ---- cálculo do CAC ----
  const sec2=el("section");
  sec2.appendChild(secHead("target","Cálculo do CAC","total de aquisição ÷ clientes fechados"));
  const tTotal=`Total investido em aquisição = mídia (${fusd(midiaEf)}) + outros custos (${fusd(outros)}) = ${fusd(total)}`;
  const tFech=`Negócios/clientes GANHOS (status won) no CRM no período = ${fi(fech)}`;
  const tCacReal = cacReal==null ? "Sem CAC real: nenhum negócio fechado no período"
    : `CAC real = total investido em aquisição ÷ clientes fechados = ${fusd(total)} ÷ ${fi(fech)} = ${fusd(cacReal)}`;
  const tCacMidia = cacMidia==null ? "Sem CAC de mídia: nenhum negócio fechado no período"
    : `CAC só de mídia = gasto em ads ÷ clientes fechados = ${fusd(midiaEf)} ÷ ${fi(fech)} = ${fusd(cacMidia)}`;
  const diff = (cacReal!=null && cacMidia!=null) ? (cacReal-cacMidia) : null;
  const k=el("div","grid g4");
  k.innerHTML=`
    <div class="kpi ind-h" data-tip="${tTotal}"><div class="k-lbl">Total investido em aquisição</div><div class="k-val">${fusd(total)}</div><div class="k-sub">mídia + outros custos do período</div></div>
    <div class="kpi ind-h" data-tip="${tFech}"><div class="k-lbl">Clientes fechados</div><div class="k-val">${fi(fech)}</div><div class="k-sub">negócios ganhos no CRM</div></div>
    <div class="kpi ind-h" data-tip="${tCacReal}"><div class="k-lbl">CAC real</div><div class="k-val" style="color:var(--laranja)">${cacReal==null?"sem dado":fusd(cacReal)}</div><div class="k-sub">total / fechados · menor é melhor</div></div>
    <div class="kpi ind-h" data-tip="${tCacMidia}"><div class="k-lbl">CAC só de mídia</div><div class="k-val">${cacMidia==null?"sem dado":fusd(cacMidia)}</div><div class="k-sub">${diff!=null?`+${fusd(diff)} de custos além da mídia`:"compare com o CAC real"}</div></div>`;
  sec2.appendChild(k);

  // ---- breakdown visual (% de cada custo no total) ----
  const itens=[];
  itens.push({lbl:"Custo de mídia (Ads)", val:midiaEf, cor:"#FF3B00"});
  const PAL=["#1d4ed8","#15803d","#9a6a00","#7c3aed","#0891b2","#be185d","#475569"];
  let pi=0;
  for(const c of CAC_CUSTOS){ if(c.auto) continue; const v=cacNum(c.id); if(v!=null && v>0){ itens.push({lbl:c.lbl, val:v, cor:PAL[pi++%PAL.length]}); } }
  for(const id of outroIds){ const v=cacNum(id); if(v!=null && v>0){ itens.push({lbl:(all[id+"_lbl"]||"Outro custo"), val:v, cor:PAL[pi++%PAL.length]}); } }
  const bkCard=el("div","chartcard"); bkCard.style.marginTop="14px";
  let bkH=`<h3>Composição do custo de aquisição</h3><div class="ch-sub">quanto cada custo representa do total de ${fusd(total)}</div><div class="cac-bk">`;
  if(total>0){
    for(const it of itens){
      const pct=100*it.val/total;
      bkH+=`<div class="bk-row"><div class="bk-lbl">${it.lbl}</div>
        <div class="bk-track"><div class="bk-fill" style="width:${Math.max(1,pct).toFixed(1)}%;background:${it.cor}"></div></div>
        <div class="bk-pct">${fusd(it.val)} · ${pct.toLocaleString(locNum(),{maximumFractionDigits:1})}%</div></div>`;
    }
  } else {
    bkH+=`<div class="muted" style="padding:6px 0">Sem custos cadastrados no período — adicione o gasto de mídia e os outros custos pra ver a composição.</div>`;
  }
  bkH+=`</div>`;
  bkCard.innerHTML=bkH;
  sec2.appendChild(bkCard);
  host.appendChild(sec2);

  // interpretação automática
  sec2.appendChild(interp(
    (cacReal==null
      ? `Sem fechamentos no período — não dá pra calcular o CAC. Selecione um período com negócios ganhos.`
      : (outros>0
          ? `CAC real de ${fusd(cacReal)} por cliente (${fi(fech)} fechados), contra ${fusd(cacMidia)} de CAC só de mídia — ou seja, ${fusd(diff)} a mais por cliente vêm de salários, ferramentas e comissões.`
          : `CAC só de mídia em ${fusd(cacMidia)} por cliente. Cadastre salários, ferramentas e comissões acima pra ver o CAC real total (que sempre é maior que o publicitário).`))
  ));
}

/* Liga os listeners da aba CAC depois de cada render. Salva em localStorage
   por período e recalcula o CAC ao vivo (re-render da aba + da Avançado). */
function afterRenderCac(){
  const host=document.getElementById("cac-content"); if(!host) return;
  // inputs de valor
  host.querySelectorAll("input.cac-inp[data-cacid]").forEach(inp=>{
    if(inp.dataset.cacwired) return; inp.dataset.cacwired="1";
    const id=inp.dataset.cacid;
    const apply=()=>{
      const v=inp.value.trim();
      // pra mídia (override): só persiste se diferir do automático
      const auto=inp.dataset.cacauto||"";
      if(id==="cac_midia" && (v===""||String(v)===String(auto))){ cacSet(id,""); }
      else { cacSet(id, v); }
      // recalcula só os números (sem re-render pesado) e re-renderiza a Avançado
      atualizaCacCalculo();
      renderAvancado(); afterRender();
    };
    inp.addEventListener("input", apply);
    inp.addEventListener("change", apply);
  });
  // inputs de rótulo das linhas livres
  host.querySelectorAll("input.cac-inp[data-caclbl]").forEach(inp=>{
    if(inp.dataset.cacwired) return; inp.dataset.cacwired="1";
    const id=inp.dataset.caclbl;
    const apply=()=>{ const all=cacLoadAll(); all[id+"_lbl"]=inp.value.trim()||"Outro custo"; cacSaveAll(all); atualizaCacCalculo(); };
    inp.addEventListener("input", apply);
    inp.addEventListener("blur", apply);
  });
  // botões remover
  host.querySelectorAll("button[data-cacdel]").forEach(b=>{
    if(b.dataset.cacwired) return; b.dataset.cacwired="1";
    b.addEventListener("click", ()=>{
      const id=b.dataset.cacdel; const all=cacLoadAll();
      delete all[id]; delete all[id+"_lbl"]; cacSaveAll(all);
      renderCac(); afterRenderCac(); renderAvancado(); afterRender();
    });
  });
  // adicionar linha
  const add=document.getElementById("cac-add");
  if(add && !add.dataset.cacwired){ add.dataset.cacwired="1";
    add.addEventListener("click", ()=>{
      const all=cacLoadAll();
      let max=0; Object.keys(all).forEach(k=>{ const m=k.match(/^cac_outro_(\d+)$/); if(m) max=Math.max(max,Number(m[1])); });
      const id="cac_outro_"+(max+1);
      all[id]=""; all[id+"_lbl"]="Outro custo"; cacSaveAll(all);
      renderCac(); afterRenderCac();
    });
  }
  // limpar custos
  const clr=document.getElementById("cac-clear");
  if(clr && !clr.dataset.cacwired){ clr.dataset.cacwired="1";
    clr.addEventListener("click", limparCac);
  }
  // tooltips de cálculo dos KPIs da aba CAC
  host.querySelectorAll(".ind-h[data-tip]").forEach(eln=>{
    eln.onmousemove=(e)=>indTip(e, eln);
    eln.onmouseleave=hideTip;
  });
}
// recalcula os KPIs da aba CAC sem reconstruir os inputs (não perde foco)
function atualizaCacCalculo(){
  const host=document.getElementById("cac-content"); if(!host) return;
  const midiaEf=cacMidiaEfetiva(), outros=cacTotalOutrosCustos(), total=midiaEf+outros;
  const fech=sumCrm("fechados");
  const cacReal=fech>0?total/fech:null, cacMidia=fech>0?midiaEf/fech:null;
  const vals=host.querySelectorAll("section:last-of-type .grid .kpi .k-val");
  // ordem dos KPIs: total · fechados · CAC real · CAC só de mídia
  if(vals.length>=4){
    vals[0].textContent=fusd(total);
    vals[1].textContent=fi(fech);
    vals[2].textContent=cacReal==null?"sem dado":fusd(cacReal);
    vals[3].textContent=cacMidia==null?"sem dado":fusd(cacMidia);
  }
  // marca visual is-set/auto nos inputs editados
  host.querySelectorAll("input.cac-inp[data-cacid]").forEach(inp=>{
    const id=inp.dataset.cacid; const isSet=(cacGet(id)!=null && cacGet(id)!=="");
    inp.classList.toggle("is-set", isSet);
  });
}

function metaRankings(){
  const rk=((D.meta_ads||{}).rankings)||{};

  let h=`<div class="chartcard"><h3>Rankings de qualidade (Meta)</h3><div class="ch-sub">${META_BRK_SUB} · quality / engagement / conversion</div>`;
  if(rk.status==="sem_dado_na_conta"){
