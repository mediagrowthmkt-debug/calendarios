  } else if(!ads.length){
    h+=`<div class="muted" style="margin-top:8px">${rk.motivo||"sem anúncios com gasto no período"}.</div>`;
  } else {
    h+=`<div class="tbl-wrap" style="box-shadow:none;border:none;margin-top:8px"><table><thead><tr><th>Anúncio</th><th>Qualidade</th><th>Engajamento</th><th>Conversão</th></tr></thead><tbody>`;
    function rkTag(v){ if(!v||v==="UNKNOWN") return '<span class="nodata">—</span>';
      const low=String(v).toLowerCase(); let cls="b-man";
      if(low.includes("above")) cls="b-real"; else if(low.includes("below")) cls="b-na";
      return `<span class="badge ${cls}">${v.replace(/_/g," ")}</span>`; }
    for(const a of ads.slice(0,12)){ h+=`<tr><td>${(a.nome||a.ad_id||"ad")}</td><td>${rkTag(a.quality_ranking)}</td><td>${rkTag(a.engagement_rate_ranking)}</td><td>${rkTag(a.conversion_rate_ranking)}</td></tr>`; }
    h+=`</tbody></table></div>`;

  h+=`</div>`; return h;

function renderMetaDetalhado(){

/* ---- Negócios ganhos no período (nome + source + valor + data + estágio) ----
   Lista cada ganho (status won) cuja data_ganho cai no RANGE_ATIVO, com badge do
   bucket (tráfego/orgânico/outro) pra conferir a atribuição. Total no rodapé bate
   com a Receita fechada no CRM (sumCrm("valor_fechado")); a soma só dos itens de
   tráfego bate com o card "Receita do tráfego pago". */
function _ganhoBadge(bucket){
  if(bucket==="trafego")  return '<span class="badge b-real">tráfego</span>';
  if(bucket==="organico") return '<span class="badge" style="background:#eef;color:#3730a3">orgânico</span>';
  return '<span class="badge" style="background:#f3f4f6;color:#4b5563">outro</span>';
}
function _dataGanhoFmt(iso){
  if(!iso) return '<span class="nodata">—</span>';
  const p=String(iso).split("-"); if(p.length<3) return escTxt(iso);
  return p[2]+"/"+label_mes_js(p[0]+"-"+p[1]);
}
function renderGanhosPeriodo(){
  const wrap=el("div"); wrap.id="crm-ganhos"; wrap.style.marginTop="14px";
  wrap.appendChild(secHead("dollar","Negócios ganhos no período","GoHighLevel · status won · por data do ganho"));
  const temArr = Array.isArray(((D.crm||{}).ganhos));
  const card=el("div","chartcard");
  if(!temArr){
    card.innerHTML=`<div class="ch-sub">Lista de ganhos indisponível nesta coleta — rode a coleta real (sem --template) pra preencher.</div>`;
    wrap.appendChild(card); return wrap;
  }
  const lista=ganhosNoRange(null);
  // ordena por valor desc (a coleta já vem ordenada, mas garante após o filtro)
  lista.sort((a,b)=>Number(b.valor||0)-Number(a.valor||0));
  const total=lista.reduce((s,g)=>s+Number(g.valor||0),0);
  const totalTraf=lista.filter(g=>g.bucket==="trafego").reduce((s,g)=>s+Number(g.valor||0),0);
  const recFechada=sumCrm("valor_fechado");
  let h=`<div class="ch-sub">Cada negócio GANHO (won) fechado no período selecionado — nome, origem (source) e valor. `
       +`Some os valores e bate com a <b>Receita fechada no CRM</b>.</div>`;
  h+=`<div class="tbl-wrap" style="box-shadow:none;border:none;margin-top:8px"><table>`
   + `<thead><tr><th>Negócio</th><th>Origem (source)</th><th style="text-align:right">Valor</th><th>Data do ganho</th><th>Estágio</th></tr></thead><tbody>`;
  if(lista.length){
    for(const g of lista){
      const src = (g.source==null || String(g.source).trim()==="")
        ? '<span class="nodata">sem origem</span>' : escTxt(g.source);
      h+=`<tr>`
        +`<td>${escTxt(g.nome||"(sem nome)")}</td>`
        +`<td>${src} ${_ganhoBadge(g.bucket)}</td>`
        +`<td style="text-align:right;color:var(--verde);font-weight:700">${fusd(g.valor)}</td>`
        +`<td>${_dataGanhoFmt(g.data_ganho)}</td>`
        +`<td>${escTxt(g.estagio||"—")}</td>`
        +`</tr>`;
    }
    // rodapé: total dos ganhos do período (bate com a Receita fechada no CRM)
    const bate = Math.abs(total-recFechada) < 0.5;
    h+=`<tr style="font-weight:800;border-top:2px solid var(--linha)">`
      +`<td>Total (${fi(lista.length)} ${lista.length===1?"negócio":"negócios"})</td>`
      +`<td><span class="muted" style="font-weight:600">tráfego ${fusd(totalTraf)}</span></td>`
      +`<td style="text-align:right;color:var(--verde)">${fusd(total)}</td>`
      +`<td colspan="2"><span class="muted" style="font-weight:600">Receita fechada no CRM = ${fusd(recFechada)}${bate?" (bate)":" (ver nota)"}</span></td>`
      +`</tr>`;
  } else {
    h+=`<tr><td colspan="5"><span class="nodata">nenhum negócio ganho neste período</span></td></tr>`;
  }
  h+=`</tbody></table></div>`;
  card.innerHTML=h; wrap.appendChild(card);
  return wrap;
}

function dbTable(cols, rows){
  const wrap=el("div","tbl-wrap");
  let h=`<table class="db"><thead><tr>`+cols.map(c=>`<th>${c}</th>`).join("")+`</tr></thead><tbody>`;
  for(const r of rows){
    if(r.length===2 && r[1] && r[1].__na){
      h+=`<tr><td>${r[0]}</td><td colspan="${cols.length-1}" class="nodata"><span style="display:inline-flex;align-items:center;gap:5px">${ico("alert","#9aa1ad",14)}${r[1].motivo}</span></td></tr>`;

    }
  }
  h+=`</tbody></table>`; wrap.innerHTML=h; return wrap;
}

/* =========================================================================
   CAMPANHAS DO PERÍODO — melhores e piores (aba Geral)
   Some por completo quando o período não tem campanha com atividade.
   Respeita o filtro de data: soma só os meses do range (por_mes) e gateia
   janelas sub-mensais na base diária Meta+Google.
   ========================================================================= */
let CP_METRICA = "leads";   // leads | cliques | ctr | publico | anuncios

// soma os meses do range ativo num bloco {por_mes:{YYYY-MM:{...}}}
function cpSomaPorMes(porMes){
  const acc={spend:0,clicks:0,impressions:0,leads:0,conversoes:0,_tem:false};
  if(!porMes) return acc;
  for(const ym of mesesNoRange(RANGE_ATIVO.ini, RANGE_ATIVO.fim)){
    const m=porMes[ym]; if(!m) continue;
    acc.spend+=Number(m.spend||0); acc.clicks+=Number(m.clicks||0);
    acc.impressions+=Number(m.impressions||0); acc.leads+=Number(m.leads||0);
    acc.conversoes+=Number(m.conversoes||0); acc._tem=true;
  }
  return acc;
}
// houve veiculação paga (Meta OU Google) na janela ATIVA? — gate de janela sub-mensal
function cpHouveVeiculacao(){
  const s=(somaCampoFonteEm(D.meta_ads,"spend",RANGE_ATIVO.ini,RANGE_ATIVO.fim)||0)
        +(somaCampoFonteEm(D.google_ads,"spend",RANGE_ATIVO.ini,RANGE_ATIVO.fim)||0);
  const i=(somaCampoFonteEm(D.meta_ads,"impressions",RANGE_ATIVO.ini,RANGE_ATIVO.fim)||0)
        +(somaCampoFonteEm(D.google_ads,"impressions",RANGE_ATIVO.ini,RANGE_ATIVO.fim)||0);
  return s>0 || i>0;
}
// constrói a lista unificada de campanhas (Meta + Google) com métricas do range.
// Para janela sub-mensal (Hoje/semana), os campos por_mes são do mês inteiro;
// nesse caso só ENTRAM as campanhas se a base diária acusa veiculação no range
// (senão a seção some) e os números são marcados como do mês corrente.
function cpCampanhas(){
  const sub = subMensal(RANGE_ATIVO.ini, RANGE_ATIVO.fim);
  if(sub && !cpHouveVeiculacao()) return [];     // janela curta sem veiculação -> some
  const out=[];
  const fontes=[
    {origem:"meta",   lista:((D.meta_ads||{}).campanhas)||[]},
    {origem:"google", lista:((D.google_ads||{}).campanhas)||[]}
  ];
  for(const f of fontes){
    if(!Array.isArray(f.lista)) continue;
    for(const c of f.lista){
      const a=cpSomaPorMes(c.por_mes);
      // sem breakdown por_mes -> não dá pra atribuir ao range -> ignora p/ não inventar
      const ativo = a._tem && (a.spend>0 || a.clicks>0 || a.impressions>0 || a.leads>0 || a.conversoes>0);
      if(!ativo) continue;
      const ctr = a.impressions>0 ? (100*a.clicks/a.impressions) : 0;
      out.push({
        nome:c.nome||"(sem nome)", origem:f.origem,
        status:c.status||"pausada",
        spend:a.spend, clicks:a.clicks, impressions:a.impressions,
        leads: f.origem==="google" ? a.conversoes : a.leads,
        ctr: Math.round(ctr*100)/100
      });
    }
  }
  return out;
}
// constrói a lista de ANÚNCIOS (criativos_top) ou PÚBLICOS (publicos_top) com
// métricas SOMADAS no range ativo via por_mes. Item sem atividade no período
// (sem por_mes nos meses do range, ou tudo zero) NÃO entra — igual campanhas.
// Para janela sub-mensal usa o mesmo gate de veiculação das campanhas.
// fontes = [{origem:"meta"|"google", lista:[...]}] — combina plataformas num só ranking.
function cpEntidadesMeta(fontes){
  const sub = subMensal(RANGE_ATIVO.ini, RANGE_ATIVO.fim);
  if(sub && !cpHouveVeiculacao()) return [];   // janela curta sem veiculação -> some
  const out=[];
  for(const f of fontes){
    if(!Array.isArray(f.lista)) continue;
    for(const it of f.lista){
      const a=cpSomaPorMes(it.por_mes);
      const ativo = a._tem && (a.spend>0 || a.clicks>0 || a.impressions>0 || a.leads>0);
      if(!ativo) continue;
      const ctr = a.impressions>0 ? (Math.round(100*a.clicks/a.impressions*100)/100) : 0;
      out.push(Object.assign({}, it, {
        spend:a.spend, clicks:a.clicks, impressions:a.impressions, leads:a.leads, ctr:ctr,
        origem: it.origem || f.origem
      }));
    }
  }
  return out;
}
// ANÚNCIOS = Meta (criativos_top) + Google Ads (criativos_top) num ranking único.
function cpAnuncios(){
  return cpEntidadesMeta([
    {origem:"meta",   lista:((D.meta_ads||{}).criativos_top)||[]},
    {origem:"google", lista:((D.google_ads||{}).criativos_top)||[]}
  ]);
}
// PÚBLICOS = só Meta (Google Ads não tem nível de público equivalente aqui).
function cpPublicos(){
  return cpEntidadesMeta([{origem:"meta", lista:((D.meta_ads||{}).publicos_top)||[]}]);
}
// valor da métrica selecionada num item de campanha
function cpValor(c, metrica){
  if(metrica==="cliques") return c.clicks;
  if(metrica==="ctr")     return c.ctr;
  return c.leads; // default p/ leads
}
const CP_METRICA_LABEL={todos:"Todos",leads:"Leads",cliques:"Cliques",ctr:"CTR",publico:"Público",anuncios:"Anúncios"};
function cpBadgeStatus(st){
  const map={ativa:["st-ativa","No ar"],pausada:["st-pausada","Pausado"],encerrada:["st-encerrada","Encerrada"]};
  const m=map[st]||map.pausada;
  return `<span class="cp-badge ${m[0]}"><span class="dot"></span>${m[1]}</span>`;
}
function cpBadgeOrigem(origem){
  // badge de PLATAFORMA com icone de marca real (Simple Icons) — separado do status.
  return origem==="google"
    ? `<span class="cp-badge origem google"><span class="bico">${brandIcon("googleads",14)}</span>Google Ads</span>`
    : `<span class="cp-badge origem meta"><span class="bico">${brandIcon("meta",14)}</span>Meta</span>`;
}
// card de uma campanha (tipo melhor/pior), destacando a métrica selecionada
function cpCard(c, tipo){

    linha("Leads", fi(c.leads), m==="leads"),

  ].join("");

}
// card de ANÚNCIO (criativos_top) — usa thumb quando houver (Meta). Anúncio de
// search do Google não tem imagem: mostra o ícone de marca Google Ads no lugar.
// Números já são do período.
function cpCardAnuncio(a, tipo){

// card de PÚBLICO (publicos_top / adsets Meta) — números já são do período.
function cpCardPublico(p, tipo){
  const mets=[
    `<div class="m foco"><b>${fi(p.leads)}</b>Leads</div>`,
    `<div class="m"><b>${fi(p.clicks)}</b>Cliques</div>`,

// QUANTAS mostrar de cada lado conforme o total disponível
function cpQtdLado(total){ return total>=6 ? 3 : (total>=4 ? 2 : 1); }

// O conteúdo (re-renderizado ao trocar o filtro, sem reconstruir a seção toda)
function cpConteudo(){
  const m=CP_METRICA;
  // ----- modo TODOS: lista COMPLETA de campanhas ativas no período (não só melhores/piores) -----
  if(m==="todos"){
    const camps=cpCampanhas();
    if(!camps.length) return null;
    const ord=camps.slice().sort((a,b)=>(b.leads-a.leads)||(b.spend-a.spend));
    return `<div class="grid g3">
      <div style="grid-column:1/-1"><div class="cp-grupo-tit melhor"><span class="dot"></span>Todas as campanhas que veicularam no período (${ord.length})</div></div>
      ${ord.map(c=>cpCard(c,"todos")).join("")}
    </div>`;
  }
  // ----- modo ANÚNCIOS (criativos_top) — só os ativos no PERÍODO (por_mes) -----
  if(m==="anuncios"){
    let ads=cpAnuncios();
    if(!ads.length) return null;
    ads=ads.slice().sort((a,b)=>(b.leads-a.leads)||(b.clicks-a.clicks));
    const n=cpQtdLado(ads.length);
    const melhores=ads.slice(0,n);
    const piores = ads.length>n ? ads.slice(-Math.min(n, ads.length-n)) : [];
    return cpBlocoHtml(
      melhores.map(a=>cpCardAnuncio(a,"melhor")),
      piores.map(a=>cpCardAnuncio(a,"pior")),
      "anúncios com mais leads", "anúncios com menos leads");
  }
  // ----- modo PÚBLICO (publicos_top) — só os ativos no PERÍODO (por_mes) -----
  if(m==="publico"){
    let ps=cpPublicos();
    if(!ps.length) return null;
    ps=ps.slice().sort((a,b)=>(b.leads-a.leads)||(b.clicks-a.clicks));
    const n=cpQtdLado(ps.length);
    const melhores=ps.slice(0,n);
    const piores = ps.length>n ? ps.slice(-Math.min(n, ps.length-n)) : [];
    return cpBlocoHtml(
      melhores.map(p=>cpCardPublico(p,"melhor")),
      piores.map(p=>cpCardPublico(p,"pior")),
      "públicos com mais leads", "públicos com menos leads");
  }
  // ----- modos LEADS / CLIQUES / CTR (campanhas) -----
  const camps=cpCampanhas();
  if(!camps.length) return null;
  const ord=camps.slice().sort((a,b)=>cpValor(b,m)-cpValor(a,m));
  const n=cpQtdLado(ord.length);
  const melhores=ord.slice(0,n);
  const piores = ord.length>n ? ord.slice(-Math.min(n, ord.length-n)) : [];
  const lblM=CP_METRICA_LABEL[m].toLowerCase();
  return cpBlocoHtml(
    melhores.map(c=>cpCard(c,"melhor")),
    piores.map(c=>cpCard(c,"pior")),
    "maior "+lblM, "menor "+lblM);
}
function cpBlocoHtml(melhoresHtml, pioresHtml, tituloM, tituloP){
  let html=`<div class="grid g3">
    <div style="grid-column:1/-1">
      <div class="cp-grupo-tit melhor"><span class="dot"></span>Melhores — ${tituloM}</div>
    </div>
    ${melhoresHtml.join("")}`;
  if(pioresHtml.length){
    html+=`<div style="grid-column:1/-1;margin-top:6px">
      <div class="cp-grupo-tit pior"><span class="dot"></span>Piores — ${tituloP}</div>
    </div>${pioresHtml.join("")}`;
  }
  html+=`</div>`;
  return html;
}
// visão rápida (chips) no topo da seção — reflete a MESMA entidade dos cards
// no modo atual: campanhas (Leads/Cliques/CTR), anúncios (Anúncios), públicos (Público).
function cpResumoHtml(){
  const m=CP_METRICA;
  // entidade ativa no período conforme o modo
  let itens, entLabel;
  if(m==="anuncios"){ itens=cpAnuncios(); entLabel="anúncios"; }
  else if(m==="publico"){ itens=cpPublicos(); entLabel="públicos"; }
  else { itens=cpCampanhas(); entLabel="campanhas"; }

  const noar=itens.filter(c=>(c.status||"pausada")==="ativa").length;
  const paus=itens.length-noar;
  const inv=itens.reduce((a,c)=>a+(c.spend||0),0);

  // chip de métrica do modo: total de leads/cliques (ou CTR médio) da entidade exibida
  let resumoMet="";
  if(m==="leads"||m==="cliques"||m==="ctr"){
    if(m==="ctr"){
      const imp=itens.reduce((a,c)=>a+(c.impressions||0),0), clk=itens.reduce((a,c)=>a+(c.clicks||0),0);
      resumoMet=`<div class="cp-chip"><span class="cc-n">${fpct(imp>0?100*clk/imp:0)}</span><span class="cc-l">CTR médio</span></div>`;
    } else {
      const tot = itens.reduce((a,c)=>a+(cpValor(c,m)||0),0);
      resumoMet=`<div class="cp-chip"><span class="cc-n">${fi(tot)}</span><span class="cc-l">${CP_METRICA_LABEL[m]} no período</span></div>`;
    }
  } else {
    // Anúncios / Público: o foco é Leads — mostra total de leads da entidade
    const tot = itens.reduce((a,c)=>a+(c.leads||0),0);
    resumoMet=`<div class="cp-chip"><span class="cc-n">${fi(tot)}</span><span class="cc-l">leads no período</span></div>`;
  }

  return `<div class="cp-resumo">
    <div class="cp-chip"><span class="cc-n">${itens.length}</span><span class="cc-l">${entLabel} no período</span></div>
    <div class="cp-chip"><span class="cc-n">${noar}</span><span class="cc-l">no ar</span></div>
    <div class="cp-chip"><span class="cc-n">${paus}</span><span class="cc-l">pausados/encerrados</span></div>
    <div class="cp-chip"><span class="cc-n">${fusd(inv)}</span><span class="cc-l">investimento total</span></div>
    ${resumoMet}
  </div>`;
}
// re-renderiza só o miolo ao trocar o filtro
function cpSetMetrica(metrica){
  CP_METRICA=metrica;
  document.querySelectorAll(".cp-fb").forEach(b=>b.classList.toggle("on", b.dataset.m===metrica));
  const r=document.getElementById("cp-resumo"); if(r) r.innerHTML=cpResumoHtml();

// existe ALGO pra mostrar nesta seção no período ativo? (decide se a seção aparece)
// usa as listas JÁ filtradas por período (por_mes) — anúncios/públicos sem

// monta a seção inteira (chamada na aba Geral). Retorna null quando vazia.

  </span>`;
  s.appendChild(filtro);

  s.appendChild(body);
  s.appendChild(interp("o ranking respeita o período filtrado e o status real de cada campanha; foque verba nas que estão no ar e lideram a métrica, e revise oferta/criativo das piores antes de pausar."));
  return s;

/* =========================================================================
   LOCAL FALCON — Posição no Google Maps (ARP/SoLV/mapa de calor)
   Lê D.local_falcon (histórico de scans). Scan NOVO = botão dedicado que
   consome crédito (via /api/relatorio-cliente/local-falcon/scan, SSE).
   - Aba Geral  : card BÁSICO (melhor termo + onde melhorar + mini-mapa)
   - Aba Avançado: painel de controle + tabela 5 kw + mapa + quadrantes + ações
   ========================================================================= */
const LF = { data: (D.local_falcon || {}), viewDate: null, kwView: null, mapMode: "mapa" };
function lfScans(){ return (LF.data && LF.data.scans) || []; }
function lfTemDados(){ return lfScans().length > 0 || BLOCOS.local_falcon === true; }
function lfSlug(){ return (D.cliente && D.cliente.slug) || LF.data.slug || ""; }
function lfScan(d){ const sc=lfScans(); if(!sc.length) return null; if(!d) return sc[0]; return sc.find(s=>s.date===d) || sc[0]; }
function lfCfg(){
  const c = (LF.data && LF.data.config) || {};
  const last = lfScan(LF.viewDate) || {};
  return {
    keywords: c.keywords || (last.keywords||[]).map(k=>k.keyword),
    grid_size: c.grid_size || last.grid_size || 7,
    radius: c.radius || last.radius || 10,
    measurement: c.measurement || last.measurement || "km",
    lat: c.lat!=null?c.lat:last.lat, lng: c.lng!=null?c.lng:last.lng,
  };
}
function lfFmtData(d){ if(!d) return "—"; const p=d.split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):d; }
function lfAgeBadge(date){
  if(!date) return "";
  const dd=new Date(date+"T12:00:00"), now=new Date();
  const dias=Math.max(0, Math.round((now-dd)/86400000));
  let bg="#0d8a3e", tx="✓ recente";
  if(dias>7){ bg="#c0392b"; tx="⚠ desatualizado"; }
  else if(dias>1){ bg="#d97a28"; tx="• "+dias+" dias"; }
  else { tx = dias<=0 ? "✓ hoje" : "✓ ontem"; }
  return `<span style="background:${bg};color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap">${tx}</span>`;
}
function lfRankColor(r){
  if(r==null) return {bg:"#eef1f4",fg:"#9aa4b2"};
  if(r<=3)   return {bg:"#0d8a3e",fg:"#fff"};
  if(r<=10)  return {bg:"#f4a52a",fg:"#1a1a1a"};
  if(r<=20)  return {bg:"#e0703a",fg:"#fff"};
  return {bg:"#c0392b",fg:"#fff"};
}
function lfHeatHtml(grid, size, cell){
  if(!grid || !grid.length) return `<div style="color:#9aa4b2;font-size:12px">sem mapa</div>`;
  size = size || grid.length; cell = cell || 30;
  let cells="";
  for(const row of grid){ for(const v of row){ const c=lfRankColor(v);
    cells += `<div style="background:${c.bg};color:${c.fg};width:${cell}px;height:${cell}px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:${cell>22?12:10}px;font-weight:700">${v==null?"·":v}</div>`; } }
  return `<div style="display:inline-grid;grid-template-columns:repeat(${size},${cell}px);gap:3px">${cells}</div>`;
}
function lfHeatComBussola(grid, size, cell){
  return `<div style="display:flex;align-items:center;gap:8px">
      <div style="font-size:10px;color:#9aa4b2;font-weight:700;letter-spacing:1px">O</div>
      <div style="text-align:center">
        <div style="font-size:10px;color:#9aa4b2;font-weight:700;margin-bottom:3px">NORTE ↑</div>
        ${lfHeatHtml(grid,size,cell)}
        <div style="font-size:10px;color:#9aa4b2;font-weight:700;margin-top:3px">SUL ↓</div>
      </div>
      <div style="font-size:10px;color:#9aa4b2;font-weight:700;letter-spacing:1px">L</div>
    </div>`;
}
function lfLegenda(){
  const it=(bg,fg,t)=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#475569"><span style="width:13px;height:13px;border-radius:3px;background:${bg};display:inline-block"></span>${t}</span>`;
  return `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px">

}

  const k=(sc.keywords||[]).find(x=>x.keyword===LF.kwView)||(sc.keywords||[])[0]; if(!k) return;
  const st=k.stats||{};
  const modo = (LF.mapMode==="grade" || (!k.map_image && !k.report_key)) ? "grade" : "mapa";
  const lado = `<div style="font-size:12px;color:#475569;flex:1;min-width:230px">
      <div style="margin-bottom:8px">Cada pino é um ponto de busca no Google Maps. A cor mostra em que posição a empresa aparece ali.</div>
      ${lfLegenda()}
      ${lfCompetitorsHtml(k)}
      ${lfKwTip(k)}
      ${k.public_url?`<div style="margin-top:12px"><a href="${k.public_url}" target="_blank" rel="noopener" style="font-size:12px;color:var(--laranja);font-weight:700;text-decoration:none">🔗 Abrir mapa interativo do Local Falcon ↗</a></div>`:""}
    </div>`;
  let vis;
  if(modo==="mapa"){
    const mapUrl=`https://lf-static-v2.localfalcon.com/image/${encodeURIComponent(k.report_key||"")}`;
    vis=`<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
        <div data-lf-mapimg style="width:380px;max-width:100%;min-height:200px;border-radius:10px;border:1px solid #e2e8f0;background:#f1f5f9 url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22><text x=%222%22 y=%2216%22 font-size=%2210%22 fill=%22%2394a3b8%22>carregando…</text></svg>') no-repeat center">
          <img src="${mapUrl}" alt="Mapa Google — ${k.keyword}" style="width:100%;display:block;border-radius:10px" loading="lazy" onerror="lfMapaErro(this)">
        </div>
        ${lado}
      </div>`;
  } else {
    vis=`<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">

        ${lado}
      </div>`;
  }
  host.innerHTML=`${vis}
    <div style="margin-top:12px;font-size:12px;color:#475569">"<b>${k.keyword}</b>" · ARP <b>${k.arp!=null?Number(k.arp).toFixed(1):"—"}</b> · SoLV <b>${k.solv!=null?Math.round(k.solv)+"%":"—"}</b> · aparece em <b>${(k.found_in!=null?k.found_in:st.found)||0}/${st.total||49}</b> pontos (top 3 em ${st.top3||0})</div>`;
  // estado visual do toggle
  const bm=document.getElementById("lf-mode-mapa"), bg=document.getElementById("lf-mode-grade");

    bm.style.cssText=`border:0;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;${modo==="mapa"?on:off}`;
    bg.style.cssText=`border:0;border-left:1px solid #cbd5e1;padding:6px 11px;font-size:11.5px;font-weight:700;cursor:pointer;${modo==="grade"?on:off}`;
  }
}
function lfTrocarModo(m){ LF.mapMode=m; lfPintarHeat(); }
function lfTrocarKeyword(v){ LF.kwView=v; lfPintarHeat(); }
// mapa real do CDN falhou/lento -> troca pela grade de números na hora
function lfMapaErro(img){

    ${ins.top_solv!=null?`<div style="font-size:11px;color:#64748b;margin-top:7px;border-top:1px solid #f1f5f9;padding-top:6px">O líder aparece no top 3 em <b style="color:#0d8a3e">${Math.round(ins.top_solv)}%</b> da região · a empresa em <b style="color:#c0392b">${Math.round(ins.your_solv||0)}%</b>. São <b>${ins.active||"—"}</b> concorrentes ativos disputando.</div>`:""}

// Plano CONCRETO e ESPECÍFICO pra chegar ao #1 nessa palavra (paleta MG, sem "IA")
function lfKwTip(k){
  const sc=lfScan(LF.viewDate); const ap=(sc&&sc.ai_plan)||{};
  let pk=(ap.por_keyword||{})[k.keyword];
  if(!pk) return "";
  let situacao="", acoes=[];
  if(typeof pk==="string"){ situacao=pk; }
  else { situacao=pk.situacao||""; acoes=pk.acoes||[]; }

function lfSalvarConfig(){

  fetch("/api/relatorio-cliente/local-falcon/config",{method:"POST",headers:{"Content-Type":"application/json"},

function lfRefresh(){
  return fetch("/api/relatorio-cliente/local-falcon/history?cliente="+encodeURIComponent(lfSlug()))
    .then(r=>r.json()).then(j=>{ if(j&&j.scans){ LF.data=j; LF.viewDate=null; LF.kwView=null;

}
// Busca o histórico vivo ao abrir e só re-renderiza se houver scan mais novo que o
// embutido (evita flash quando nada mudou). Falha em silêncio em PDF/offline.
function lfAutoRefresh(){
  if(!lfTemDados()) return;
  const embN=lfScans().length, embTop=(lfScans()[0]||{}).date||"";
  fetch("/api/relatorio-cliente/local-falcon/history?cliente="+encodeURIComponent(lfSlug()))
    .then(r=>r.json()).then(j=>{
      if(!j||!j.scans) return;
      const mudou=(j.scans.length!==embN)||((j.scans[0]||{}).date!==embTop);
      LF.data=j;
      if(mudou){ LF.viewDate=null; LF.kwView=null;
        if(document.getElementById("ge-content")) renderGeral(); renderAvancado(); }
    }).catch(()=>{});
}
function lfGerarScan(){
  const cfg=lfColetaConfigForm();
  const custo=(cfg.keywords.length||0)*Math.pow(parseInt(cfg.grid_size||7),2);
  if(!cfg.keywords.length){ alert("Defina ao menos 1 palavra-chave."); return; }
  if(!confirm(`Rodar scan de ${cfg.keywords.length} palavra(s) no Google Maps?\n\nIsso consome ~${custo} créditos do Local Falcon (1 por ponto, por termo).`)) return;
  const btn=document.getElementById("lf-btn-scan"); const box=document.getElementById("lf-scan-status");
  if(btn){btn.disabled=true;btn.style.opacity=".6";}
  if(box){box.style.display="block";box.textContent="Salvando config e iniciando scan…\n";}
  // salva a config atual ANTES (o worker usa a config salva)
  fetch("/api/relatorio-cliente/local-falcon/config",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({cliente:lfSlug(), config:cfg})})
    .then(()=>{
      const es=new EventSource("/api/relatorio-cliente/local-falcon/scan?cliente="+encodeURIComponent(lfSlug()));
      es.onmessage=(ev)=>{ let d; try{d=JSON.parse(ev.data);}catch(e){return;}
        if(d.type==="progress"&&box){ box.textContent+=d.line+"\n"; box.scrollTop=box.scrollHeight; }
        else if(d.type==="done"){ es.close(); if(box) box.textContent+="\n✓ Scan concluído. Atualizando relatório…\n";
          lfRefresh().then(()=>{ if(btn){btn.disabled=false;btn.style.opacity="1";} }); }
        else if(d.type==="error"){ es.close(); if(box) box.textContent+="\n✗ Erro: "+(d.msg||"")+"\n"; if(btn){btn.disabled=false;btn.style.opacity="1";} }
      };
      es.onerror=()=>{ es.close(); if(box) box.textContent+="\n(conexão encerrada)"; if(btn){btn.disabled=false;btn.style.opacity="1";} };
    });
}

function bannerValidacao(){
  // Banner da AUTO-VALIDACAO (gerar.py): só aparece quando há inconsistência ou
  // ponto de atenção. Garante que o relatório "faz sentido" — nada de número
  // contraditório calado. Verde/sem-alerta = não renderiza nada.
  const v=D.validacao||{};
  if(!v.status || v.status==="ok") return el("div","");
  const avisos=(v.checks||[]).filter(c=>c.nivel==="erro"||c.nivel==="aviso");
  if(!avisos.length) return el("div","");
  const erro=v.status==="erro";
  const cor=erro?"#b91c1c":"#92700a", bg=erro?"#fef2f2":"#fffbeb", bd=erro?"#fecaca":"#fde68a";
  const wrap=el("div"); wrap.style.cssText=`margin:10px 0 4px;border:1px solid ${bd};background:${bg};border-radius:12px;padding:12px 14px`;
  let h=`<div style="display:flex;align-items:center;gap:8px;font-weight:800;color:${cor};font-size:13px">${ico("alert",cor,16)}<span>Verificação automática do relatório — ${erro?"inconsistência detectada":"pontos de atenção"}</span></div>`;
  h+=`<ul style="margin:8px 0 0;padding-left:22px;color:${cor};font-size:12.5px;line-height:1.55">`;
  avisos.forEach(c=>{ h+=`<li>${c.nivel==="erro"?"🔴":"⚠️"} ${c.msg}</li>`; });
  h+=`</ul>`;
  // BOTÕES DE AÇÃO DINÂMICA — atualiza SÓ a fonte afetada (--only), sem refazer o
  // relatório inteiro. Mapeia o tipo de alerta -> fonte a recoletar.
  const ids=new Set(avisos.map(c=>c.id));
  const btns=[];
  if(ids.has("organico_integracoes"))
    btns.push(`<button onclick="regerarRelatorio('organico,stories')" style="cursor:pointer;border:1px solid ${bd};background:#fff;color:${cor};font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px">↻ Reconectei — atualizar só o orgânico</button>`);
  if(ids.has("gads_campanhas")||ids.has("gads_reconciliacao")||ids.has("gads_conexao"))
    btns.push(`<button onclick="regerarRelatorio('gads')" style="cursor:pointer;border:1px solid ${bd};background:#fff;color:${cor};font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px">↻ Atualizar só o Google Ads</button>`);
  if(ids.has("meta_conexao"))
    btns.push(`<button onclick="regerarRelatorio('meta')" style="cursor:pointer;border:1px solid ${bd};background:#fff;color:${cor};font-weight:700;font-size:12px;padding:6px 12px;border-radius:8px">↻ Atualizar só o Meta Ads</button>`);
  if(btns.length) h+=`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${btns.join("")}</div>`;
  wrap.innerHTML=h; return wrap;
}

function renderApresentavel(){
  const c=document.getElementById("ap-content"); if(!c) return; c.innerHTML="";

  const invMeta=sumMeta("spend"), invGads=sumGads("spend");
  const inv=invMeta+invGads, clk=sumMeta("clicks")+sumGads("clicks");
  const leads=sumMeta("leads"), novos=sumCrm("novos_leads"), fechados=sumCrm("fechados");
  const valorFechado=sumCrm("valor_fechado");

  // ---- deltas REAIS (último mês com dado vs mês anterior com dado) ----
  // combinado Meta+Google: par [atual, anterior] somando as duas fontes no MESMO mês
  function parCombinado(field){
    const ms=[]; for(const ym of mesesAtivos()){
      const a=okMes(D.meta_ads,ym), b=okMes(D.google_ads,ym);
      const va=(a&&a[field]!=null)?Number(a[field]):null;
      const vb=(b&&b[field]!=null)?Number(b[field]):null;
      if(va!=null||vb!=null) ms.push((va||0)+(vb||0)); }
    if(!ms.length) return [null,null];
    return [ms[ms.length-1], ms.length>=2?ms[ms.length-2]:null];
  }
  const [invA,invB]=parCombinado("spend");
  const [clkA,clkB]=parCombinado("clicks");
  const dInv=delta(invA,invB,false,fusd);
  const dClk=delta(clkA,clkB,false);
  const dLeads=deltaMes(D.meta_ads,"leads");

  const [vfA,vfB]=parUltAnt(D.crm,"valor_fechado");
  const dValor=delta(vfA,vfB,false,fusd);
  // CPC médio do mês (combinado) — menor é melhor

   PRESENÇA ORGÂNICA — cards de rede social (cor + ícone de marca oficiais)

   Os big numbers dos cards usam o dado real do último mês (orgUlt).

// Configuração de cada rede: marca, cor da linha do gráfico, big number e
// métrica secundária (reference_key real do Reportei).
// kind do indicador: "flow" = soma no periodo (views/alcance/impressoes/acoes);
// "stock" = estoque, vale o ULTIMO mes ativo (seguidores/inscritos). O card respeita o periodo:
// flow agrega sobre mesesAtivos(), stock pega o ultimo mes ativo.
const REDES_SOC = [
  {key:"instagram", lineColor:"#DD2A7B",
   big:{lbl:"Visualizações", refkey:"ig:views", kind:"flow"},
   sec:{lbl:"Alcance", refkey:"ig:reach", kind:"flow"},
   tag:"Reportei · Instagram"},
  {key:"facebook", lineColor:"#1877F2",
   big:{lbl:"Visualizações", refkey:"fb:page_media_views", kind:"flow"},
   sec:{lbl:"Alcance", refkey:"fb:page_reach_total", kind:"flow"},
   tag:"Reportei · Facebook"},
  {key:"youtube", lineColor:"#FF0000",
   big:{lbl:"Visualizações", refkey:"youtube:views", kind:"flow"},
   sec:{lbl:"Inscritos", refkey:"youtube:subscriber_count", kind:"stock"},
   tag:"Reportei · YouTube"},
  {key:"tiktok", lineColor:"#111111",
   big:{lbl:"Visualizações", refkey:"tiktok:views", kind:"flow"},
   sec:{lbl:"Seguidores", refkey:"tiktok:follows", kind:"stock"},
   tag:"Reportei · TikTok"},
  {key:"pinterest", lineColor:"#E60023",
   big:{lbl:"Impressões", refkey:"pinterest:impressions", kind:"flow"},
   sec:{lbl:"Seguidores", refkey:"pinterest:followers", kind:"stock"},
   tag:"Reportei · Pinterest"},
  {key:"linkedin", lineColor:"#0A66C2",
   big:{lbl:"Visualizações", refkey:"li:impressions", kind:"flow"},
   sec:{lbl:"Seguidores", refkey:"li:followers_total", kind:"stock"},
   tag:"Reportei · LinkedIn"},
  {key:"google", lineColor:"#4285F4",
   big:{lbl:"Visualizações GBP", refkey:"gmb:total_views", kind:"flow"},
   sec:{lbl:"Solicit. de rota", refkey:"gmb:total_directions_actions", kind:"flow"},
   tag:"Reportei · Google Business"}
];

// valor do indicador respeitando o periodo selecionado — AGORA com base diária.
// `kind` vindo do REDES_SOC é só dica visual; a verdade é orgKindOf(refkey) (do JSON).
// Roteamento: add -> sumOrg (que já usa dias quando sub-mensal); unique/avg -> ranges
// exatos do preset (ou mensal); stock -> último dia do range (ou último mês).
function orgPeriodo(refkey, kind){
  const k=orgKindOf(refkey);
  if(k==="stock"){
    if(orgSubMensal()){ const v=orgUltDia(refkey); if(v!=null) return v; }
    return orgUlt(refkey);
  }
  if(k==="unique" || k==="avg"){
    if(orgSubMensal()){ const v=orgRangePreset(refkey); if(v!=null) return v; }
    // multi-mês ou sem preset: usa o mensal (avg = último; unique = último mês, não soma)
    return (k==="avg") ? orgUlt(refkey) : sumOrg(refkey);
  }
  return sumOrg(refkey);   // add
}

function orgMesVal(ym, key){
  const md=((D.organico||{}).meses||{})[ym];
  if(!md || md.status!=="ok") return null;
  for(const ind of (md.indicadores||[])){
    if(ind.reference_key===key && ind.status==="ok" && ind.valor!=null) return Number(ind.valor);
  }
  return null;
}

function gscTotal(kind, field){
  const arr=(((D.gsc||{})[kind]||{})[kind])||[];
  if(!arr.length) return null;
  return arr.reduce((a,x)=>a+Number(x[field]||0),0);
}

// refkey REAL de seguidores por rede (o campo `sec` da IG/FB é ALCANCE, não seguidores)
const FOLLOW_KEY={instagram:"ig:followers_count",facebook:"fb:page_follows",
  youtube:"youtube:subscriber_count",tiktok:"tiktok:follows",
  pinterest:"pinterest:followers",linkedin:"li:followers_total"};
// NOVOS seguidores por mês (crescimento real — "quando entram"). TikTok/Pinterest não expõem.
const NEW_FOLLOW_KEY={instagram:"ig:new_followers_count",facebook:"fb:net_page_follows",
  youtube:"youtube:subscribers_gained",linkedin:"li:followers"};
function socRefOf(r, metric){
  if(metric==="views") return r.big.refkey;
  if(metric==="novos") return NEW_FOLLOW_KEY[r.key];
  return FOLLOW_KEY[r.key] || r.sec.refkey;
}
function socDataset(metric){
  return REDES_SOC
    .filter(r => socRefOf(r,metric) && BLOCOS["rede_"+r.key]!==false)
    .map(r=>{
      const ref = socRefOf(r,metric);
      const data = mesesAtivos().map(ym=>orgMesVal(ym, ref));
      return {
        label: BRAND[r.key].nome,
        data,
        borderColor: r.lineColor,
        backgroundColor: r.lineColor+"22",
        pointBackgroundColor: r.lineColor,
        tension:.35, borderWidth:2.5, pointRadius:2.5, pointHoverRadius:5, fill:false
      };
    });
}

/* =========================================================================
   STORIES — Instagram (AJUSTE 2) — dados REAIS via Reportei (instagram_business
   id=3576459). Big numbers do último mês com dado + selo de variação (AJUSTE 1).
   Métrica sem dado no mês -> ico("alert") + "sem dado", JAMAIS inventa.
   Mini-gráfico de barras: stories postados por mês.
   ========================================================================= */
const STORIES_KPIS = [
  {key:"ig:stories_count",              lbl:"Stories postados",    menor:false},
  {key:"ig:stories_reach_total",        lbl:"Alcance",             menor:false},
  {key:"ig:stories_views",              lbl:"Visualizações",       menor:false},
  {key:"ig:stories_total_interactions", lbl:"Interações",          menor:false},
  {key:"ig:stories_shares",             lbl:"Compartilhamentos",   menor:false},
  {key:"ig:stories_swipe_forward",      lbl:"Avanços (swipe fwd)", menor:false},
  {key:"ig:stories_profile_visits",     lbl:"Visitas ao perfil",   menor:false},
  {key:"ig:stories_follows",            lbl:"Novos seguidores",    menor:false}
];

// último mês (label + chave do mês) com PELO MENOS um dado de stories ok
function stoUltMes(){
  const ms=mesesAtivos();
  for(let i=ms.length-1;i>=0;i--){ const ym=ms[i];
    const md=((D.stories||{}).meses||{})[ym];
    if(md && md.status==="ok") return ym; }
  return null;
}
function stoVal(ym, key){
  const md=((D.stories||{}).meses||{})[ym]; if(!md) return null;
  const cell=(md.valores||{})[key]||{};
  return (cell.status==="ok" && cell.valor!=null) ? Number(cell.valor) : null;
}
// ---- Stories DIÁRIO: mesma lógica do orgânico (add soma dias, reach é unique) ----
function stoKindOf(key){ return ((D.stories||{}).kind||{})[key] || "add"; }
function stoTemDias(key){
  const dd=(D.stories||{}).dias||{}; const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  if(!ini||!fim) return false;
  for(const dia of Object.keys(dd)){ if(dia>=ini&&dia<=fim&&dd[dia]&&dd[dia][key]!=null) return true; }
  return false;
}
function stoSomaDias(key){
  const dd=(D.stories||{}).dias||{}; const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  let s=0,has=false;
  for(const dia of Object.keys(dd)){ if(dia>=ini&&dia<=fim){ const v=(dd[dia]||{})[key];
    if(v!=null){ s+=Number(v); has=true; } } }
  return has?s:null;
}
function stoRangePreset(key){
  const rg=(D.stories||{}).ranges||{}; const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  for(const nome of Object.keys(rg)){ const blk=rg[nome];
    if(blk&&blk.ini===ini&&blk.fim===fim&&blk.valores&&blk.valores[key]!=null) return Number(blk.valores[key]); }
  const blk=rg[PERIODO_ATIVO];
  if(blk&&blk.valores&&blk.valores[key]!=null) return Number(blk.valores[key]);
  return null;
}
// stories: o range ativo está coberto por dias coletados? (qualquer dia em [ini,fim])
function stoRangeCoberto(){
  const dd=(D.stories||{}).dias||{}; const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  if(!ini||!fim) return false;
  for(const dia of Object.keys(dd)){ if(dia>=ini && dia<=fim) return true; }
  return false;
}
// valor de uma KPI de stories no período ativo (sub-mensal usa dia; senão último mês ok).
function stoPeriodo(key){
  if(orgSubMensal()){
    const k=stoKindOf(key);
    if(k==="add"){
      const v=stoSomaDias(key); if(v!=null) return v;
      if(stoRangeCoberto()) return 0;          // janela coberta + ausente = 0 real
    } else {                                    // unique (alcance) -> agregado exato do preset
      const v=stoRangePreset(key); if(v!=null) return v;
      if(stoRangeCoberto()) return 0;
    }
  }
  const ult=stoUltMes();
  return ult ? stoVal(ult, key) : null;
}
// stories tem base diária no range ativo? (pra decidir aviso/rótulo)
function stoSoMensal(){
  if(!orgSubMensal()) return false;
  const dd=(D.stories||{}).dias||{}, rg=(D.stories||{}).ranges||{};
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  for(const dia of Object.keys(dd)){ if(dia>=ini&&dia<=fim) return false; }
  for(const nome of Object.keys(rg)){ const b=rg[nome]; if(b&&b.ini===ini&&b.fim===fim) return false; }
  if(rg[PERIODO_ATIVO]) return false;
  return true;
}

function renderStoriesCard(){
  const card=el("div","stcard");
  const ultYm=stoUltMes();
  const stData=(D.stories||{}).meses||{};
  const algum=mesesAtivos().some(ym=>stData[ym]&&stData[ym].status==="ok")
            || Object.keys((D.stories||{}).dias||{}).length>0;
  // rótulo da janela: sub-mensal com base diária mostra o range real; multi-mês = SOMA do período
  const subDia = orgSubMensal() && !stoSoMensal();
  const nOk = mesesAtivos().filter(ym=>(stData[ym]||{}).status==="ok").length;
  const tag = subDia
    ? ("período: "+(subMensal(RANGE_ATIVO.ini,RANGE_ATIVO.fim)
        ? (RANGE_ATIVO.ini.slice(8,10)+(RANGE_ATIVO.ini===RANGE_ATIVO.fim?"":"–"+RANGE_ATIVO.fim.slice(8,10))+" "+label_mes_js(_ymOf(RANGE_ATIVO.ini)))
        : "janela ativa"))
    : (nOk?("somado no período · "+nOk+(nOk===1?" mês":" meses")+" com dado"):"sem coleta");

  let head=`<div class="st-head">
      <div class="st-ic">${brandIcon("instagram",26)}</div>
      <div><div class="st-title">Stories — Instagram</div>
        <div class="st-tag">Reportei · Instagram · ${tag}</div></div>
    </div>`;
  card.innerHTML=head;

  if(!algum){
    card.appendChild(el("div","erro-card",`${ico("alert","#b91c1c",16)} Stories indisponíveis: `
      +((Object.values(stData)[0]||{}).motivo||"sem dados")));
    return card;
  }

  const grid=el("div","st-grid");
  for(const kp of STORIES_KPIS){
    const isAdd = stoKindOf(kp.key)==="add";
    // período-aware: sub-mensal soma a base diária; multi-mês SOMA os meses pras métricas
    // aditivas (stories postados/views/interações…) e usa o último mês só pro alcance
    // ÚNICO (reach), que não pode ser somado entre meses (dedup). Bug corrigido 09-06-26:
    // antes mostrava só o último mês pra TUDO -> subcontava "Stories postados" no período.
    const v = subDia ? stoPeriodo(kp.key)
            : (isAdd ? sumStories(kp.key) : (ultYm ? stoVal(ultYm,kp.key) : null));
    const box=el("div","st-kpi");
    if(v==null){
      box.innerHTML=`<div class="stk-lbl">${kp.lbl}</div>
        <div class="stk-na">${ico("alert","#9aa1ad",15)} sem dado</div>`;
    } else {
      // delta mês-a-mês só faz sentido mostrando UM mês (alcance); número somado não tem delta
      box.innerHTML=`<div class="stk-lbl">${kp.lbl}</div>
        <div class="stk-val">${fi(v)}</div>
        <div class="delta-row">${(subDia||isAdd) ? "" : stoDelta(kp.key,kp.menor)}</div>`;
    }
    grid.appendChild(box);
  }
  card.appendChild(grid);

  // mini-gráfico de barras: stories postados por mês
  const chartWrap=el("div","chartcard"); chartWrap.style.marginTop="16px";
  chartWrap.innerHTML=`<h3>Stories postados por mês</h3>
    <div class="ch-sub">Quantidade publicada · Instagram (Reportei)</div>
    <div class="chartbox sm"><canvas id="ch-stories"></canvas></div>`;
  card.appendChild(chartWrap);

  setTimeout(buildStoriesChart, 40);
  return card;
}

/* Anexa o selo de variação à célula da ÚLTIMA linha com dado de uma tabela mensal,
   comparando cada coluna com a penúltima linha com dado. `colMap` = lista de
   {field, fmt, menor} na MESMA ordem das colunas numéricas (após "Mês"). */
function montarLinhasMensais(src, fields, fmts, menores){
  const rows=[];
  let prevOk=null;   // valores da última linha ok vista (antes da atual)
  // primeiro acha índices das linhas ok p/ saber qual é a última
  const ms=mesesAtivos();
  const okIdx=[]; ms.forEach((ym,i)=>{ if(okMes(src,ym)) okIdx.push(i); });
  const ultimoOk = okIdx.length? okIdx[okIdx.length-1] : -1;
  const penultOk = okIdx.length>=2? okIdx[okIdx.length-2] : -1;
  ms.forEach((ym,i)=>{
    const m=okMes(src,ym);
    if(!m){ rows.push([label_mes_js(ym), naRow(((src.meses||{})[ym]||{}).motivo||"sem dados")]); return; }
    const cells=[label_mes_js(ym)];
    fields.forEach((fld,ci)=>{
      const fmt=fmts[ci]||fi;
      const v=m[fld];
      let cell = (v==null? '<span class="nodata">—</span>' : fmt(v));
      // selo só na última linha com dado, comparado à penúltima com dado
      if(i===ultimoOk && penultOk>=0){
        const mp=okMes(src,ms[penultOk]);
        const vp=(mp&&mp[fld]!=null)?Number(mp[fld]):null;
        cell += ' '+delta((v==null?null:Number(v)), vp, !!(menores&&menores[ci]), fmt);
      }
      cells.push(cell);
    });
    rows.push(cells);
  });
  return rows;
}

// rótulo curto de dia (DD/Mês)
function label_dia_js(dia){
  const M={"01":"Jan","02":"Fev","03":"Mar","04":"Abr","05":"Mai","06":"Jun","07":"Jul","08":"Ago","09":"Set","10":"Out","11":"Nov","12":"Dez"};
  const p=String(dia||"").split("-"); if(p.length<3) return dia;
  return p[2]+"/"+(M[p[1]]||p[1]);
}
// linhas DIÁRIAS de uma fonte (base 'dias') dentro do range ativo. Espelha o Base
// no mesmo número que a Geral usa quando a janela é sub-mensal.
function montarLinhasDiarias(src, fields, fmts){
  const dd=(src||{}).dias||{};
  const dias=diasNoRange(RANGE_ATIVO.ini, RANGE_ATIVO.fim);
  const rows=[];
  for(const dia of dias){
    const m=dd[dia];
    if(!m){ rows.push([label_dia_js(dia), naRow("sem movimento neste dia")]); continue; }
    const cells=[label_dia_js(dia)];
    fields.forEach((fld,ci)=>{ const fmt=fmts[ci]||fi; const v=m[fld];
      cells.push(v==null?'<span class="nodata">—</span>':fmt(v)); });
    rows.push(cells);
  }
  // linha de TOTAL do período (bate com a Geral)
  if(rows.length){
    const tot=["<b>Total no período</b>"];
    fields.forEach((fld,ci)=>{ const fmt=fmts[ci]||fi; const v=somaDias(dd,RANGE_ATIVO.ini,RANGE_ATIVO.fim,fld);
      // médias (ctr/cpc) não somam — marca "—" no total pra não enganar
      const isMedia=(fld==="ctr"||fld==="cpc"||fld==="ticket_medio_fechado");
      tot.push(isMedia?'<span class="muted">—</span>':(v==null?'<span class="nodata">—</span>':`<b>${fmt(v)}</b>`)); });
    rows.push(tot);
  }
  return rows;
}

  // índices ok p/ selo na última linha
  const ms=mesesAtivos();
  const okIdx=[]; ms.forEach((ym,i)=>{ const md=stData[ym]; if(md&&md.status==="ok") okIdx.push(i); });
  const ultimoOk=okIdx.length?okIdx[okIdx.length-1]:-1;

      if(i===ultimoOk && penultOk>=0){

/* =========================================================================
   CONTAS & CONEXOES — detalhamento POR CANAL/CONTA individual (pedido do Bruno).
   Lista SEMPRE todos os canais/APIs conhecidos, mesmo ausentes, com status:
     🟢 conectado (com dado)  ·  🟡 reconectar / sub-conta / sem tag  ·  🔴 falta conectar
   Status 100% DERIVADO de D.conexoes (config: clientes.json) + D.organico/D.* (dado
   real). NADA hardcoded por cliente; canal sem dado NUNCA vira "conectado" falso.
   ========================================================================= */

// canal orgânico tem ALGUM mês com indicador status:"ok" e valor!=null? (conectado de fato)
function _canalTemDadoOk(keys){
  const meses=((D.organico||{}).meses)||{};
  for(const ym in meses){ const md=meses[ym];
    if(md && md.status==="ok"){ for(const ind of (md.indicadores||[])){
      if(keys.indexOf(ind.reference_key)>=0 && ind.status==="ok" && ind.valor!=null) return true; } } }
  return false;
}
// canal vinculado no painel mas SEM canal/sub-conta no projeto Reportei? (status "sem_canal")
function _canalSemSubconta(keys){
  const meses=((D.organico||{}).meses)||{};
  for(const ym in meses){ const md=meses[ym];
    if(md && (md.status==="ok"||md.status==="sem_dados")){ for(const ind of (md.indicadores||[])){
      if(keys.indexOf(ind.reference_key)>=0 && ind.status==="sem_canal") return true; } } }
  return false;
}
// último valor REAL conhecido (qualquer mês) de uma lista de refkeys -> {v, refkey}
function _canalUltValor(keys){
  const meses=((D.organico||{}).meses)||{};
  let best=null;
  for(const ym of Object.keys(meses).sort()){ const md=meses[ym];
    if(md && md.status==="ok"){ for(const ind of (md.indicadores||[])){
      if(keys.indexOf(ind.reference_key)>=0 && ind.status==="ok" && ind.valor!=null) best={v:Number(ind.valor), refkey:ind.reference_key, lbl:ind.indicador}; } } }
  return best;
}

// catálogo fixo de canais sociais/orgânicos conhecidos — sempre listados (mesmo ausentes).
// `intg` = chave que a integração tem em clientes.json[cliente].reportei.integrations.
// `keys` = reference_keys (big+sec do canal) usadas pra varrer o dado real.
const CONEX_CANAIS = [
  {key:"instagram", nome:"Instagram",       intg:"instagram", keys:["ig:views","ig:reach"]},
  {key:"facebook",  nome:"Facebook",        intg:"facebook",  keys:["fb:page_media_views","fb:page_reach_total"]},
  {key:"pinterest", nome:"Pinterest",       intg:"pinterest", keys:["pinterest:impressions","pinterest:followers"]},
  {key:"tiktok",    nome:"TikTok",          intg:"tiktok",    keys:["tiktok:views","tiktok:follows"]},
  {key:"youtube",   nome:"YouTube",         intg:"youtube",   keys:["youtube:views","youtube:subscriber_count"]},
  {key:"linkedin",  nome:"LinkedIn",        intg:"linkedin",  keys:["li:impressions","li:followers_total"]},
  {key:"google",    nome:"Google Business", intg:"gbp",       keys:["gmb:total_views","gmb:total_directions_actions"]}
];

const _ST = {
  on:  ["🟢","conectado",     "var(--verde)"],
  mid: ["🟡","reconectar",    "#b45309"],
  off: ["🔴","falta conectar","var(--vermelho)"]
};

function renderContasConexoes(){
  const cx=(D.conexoes||{});
  const rp=(cx.reportei||{});
  const temReportei = !!(rp.project || rp.alias);
  const integ = rp.integrations || [];        // canais conhecidos no projeto Reportei
  const rows=[];                              // {ico, nome, sub, st:[sym,txt,cor], obs}
  let nOn=0, nMid=0, nOff=0; const faltam=[];

  // ---- 1) CANAIS ORGANICOS (Reportei) ----
  for(const c of CONEX_CANAIS){
    const ligadoConfig = BLOCOS["rede_"+c.key]!==false;   // bloco da rede desligado?
    let st, obs;
    if(!temReportei){
      st=_ST.off; obs="falta conectar — cliente sem projeto no Reportei";
    } else if(integ.indexOf(c.intg)<0){
      st=_ST.off; obs="falta conectar — sem integração no projeto Reportei";
    } else if(_canalTemDadoOk(c.keys)){
      const u=_canalUltValor(c.keys);
      st=_ST.on;
      obs = u ? `conectado · ${u.lbl||"último valor"}: ${fi(u.v)}` : "conectado";
    } else if(_canalSemSubconta(c.keys)){
      st=_ST.mid; obs="vinculado no painel, mas sem canal/sub-conta no projeto — reconectar";
    } else {
      // integração existe e responde ok, mas sem números no período (zero/null real)
      st=_ST.on; obs="conectado · sem números reportados no período";
    }
    if(!ligadoConfig) obs += " · não exibido nos cards (desligado na config)";
    rows.push({brand:c.key, nome:c.nome, sub:"Rede social · Reportei", st, obs});
  }

  // ---- 2) APIs / midia paga / site / CRM ----
  // Meta Ads
  (function(){
    const acc=(cx.meta_ads||{}).account; let st,obs;
    const temDado = mesesComDado(D.meta_ads)>0;
    if(!acc){ st=_ST.off; obs="falta conectar — sem conta de anúncios (act_) na config"; }
    else if(temDado){ st=_ST.on; obs="conectado · "+acc; }
    else { st=_ST.mid; obs="conta configurada ("+acc+") mas sem dado no período"; }
    rows.push({brandIco:"meta", nome:"Meta Ads", sub:"Mídia paga · Meta Graph", st, obs});
  })();
  // Google Ads
  (function(){
    const cust=(cx.google_ads||{}).customer; let st,obs;
    const temDado = mesesComDado(D.google_ads)>0;
    if(!cust){ st=_ST.off; obs="falta conectar — sem customer Google Ads na config"; }
    else if(temDado){ st=_ST.on; obs="conectado · customer "+cust; }
    else { st=_ST.mid; obs="customer configurado ("+cust+") mas sem dado no período"; }
    rows.push({brandIco:"googleads", nome:"Google Ads", sub:"Mídia paga · Google Ads API", st, obs});
  })();
  // GA4
  (function(){
    const g=(cx.ga4||{}); let st,obs;
    if(!g.property){ st=_ST.off; obs="falta conectar — sem property GA4 na config"; }
    else if(!g.tag_desde){ st=_ST.mid; obs="property "+g.property+" · sem tag no site (sem coleta)"; }
    else { st=_ST.on; obs="conectado · property "+g.property+" (tag desde "+g.tag_desde+")"; }
    rows.push({ico:"globe", nome:"Google Analytics 4", sub:"Comportamento no site · GA4", st, obs});
  })();
  // Search Console
  (function(){
    const site=(cx.gsc||{}).site; let st,obs;
    if(!site){ st=_ST.off; obs="falta conectar — sem site na config"; }
    else { st=_ST.on; obs="conectado · "+site.replace("sc-domain:",""); }
    rows.push({ico:"search", nome:"Search Console", sub:"SEO orgânico · GSC", st, obs});
  })();
  // CRM GoHighLevel
  (function(){
    const loc=(cx.ghl||{}).location; let st,obs;
    const opps=((D.crm||{}).total_opps_pipeline)||0;
    if(!loc){ st=_ST.off; obs="falta conectar — sem location GoHighLevel na config"; }
    else if(opps>0){ st=_ST.on; obs="conectado · "+fi(opps)+" oportunidades no pipeline"; }
    else { st=_ST.mid; obs="location configurada mas sem oportunidades no pipeline"; }
    rows.push({ico:"users", nome:"CRM GoHighLevel", sub:"Funil / leads · GHL", st, obs});
  })();

  // ---- contagem p/ a linha-resumo ----
  for(const r of rows){
    if(r.st===_ST.on) nOn++;
    else if(r.st===_ST.mid) nMid++;
    else { nOff++; faltam.push(r.nome); }
  }
  const total=rows.length;

  // ---- HTML ----
  let h=`<h2 style="margin-top:22px">${ico("layers","var(--laranja)",18)} Contas &amp; conexões</h2>`;
  h+=`<div class="muted" style="margin:-4px 0 12px">Todos os canais e APIs conhecidos, com o status real de cada um. Derivado da configuração do cliente cruzada com o dado coletado — nunca um "conectado" sem número que prove.</div>`;
  // linha-resumo
  h+=`<div class="conex-resumo">`
    +`<span style="color:var(--verde)"><b>🟢 ${nOn}</b> de ${total} conectadas</span>`
    +` · <span style="color:#b45309"><b>🟡 ${nMid}</b> a reconectar</span>`
    +` · <span style="color:var(--vermelho)"><b>🔴 ${nOff}</b> a conectar</span>`;
  if(faltam.length) h+=`<div style="margin-top:6px;color:var(--vermelho)"><b>Falta conectar:</b> ${faltam.join(" · ")}</div>`;
  h+=`</div>`;
  // itens
  for(const r of rows){
    const icoHtml = r.brand ? brandIcon(r.brand,18)
                  : r.brandIco ? brandIcon(r.brandIco,18)
                  : ico(r.ico||"globe", r.st[2], 18);
    h+=`<div class="fonte-item">
        <div class="conex-ic">${icoHtml}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:13px">${r.nome}</div>
          <div class="muted">${r.sub} — ${r.obs}</div>
        </div>
        <div class="muted" style="text-align:right;font-weight:700;color:${r.st[2]};white-space:nowrap">${r.st[0]} ${r.st[1]}</div>
      </div>`;
  }
  return h;
}

function coberturaMeses(src){
  if(!src||!src.meses) return "—";
  const ok=Object.keys(src.meses).filter(m=>(src.meses[m]||{}).status==="ok");
  if(!ok.length) return "sem dados no período";
  return ok.length+" meses com dado";
}
// quantos meses uma fonte (meta_ads/google_ads/...) trouxe com status ok? (0 = sem dado)
function mesesComDado(src){
  if(!src||!src.meses) return 0;
  return Object.keys(src.meses).filter(m=>(src.meses[m]||{}).status==="ok").length;
}

  renderGeral(); renderAvancado(); renderBase(); renderFontes(); afterRender(); renderCac(); afterRenderCac();
}
// PERSONALIZADO: calendário próprio (não usa o input nativo). Seleciona início e fim
// clicando nos dias; navega meses; "Aplicar" usa o range escolhido.
let CR_START=null, CR_END=null, CR_VIEW=null;
const _MESES_PT=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function _calMin(){ return ((D.meses&&D.meses[0])?D.meses[0]:"2026-01")+"-01"; }
function _brData(iso){ const p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0].slice(2); }
function toggleCustom(){
  const pop=document.getElementById("cal-pop"); if(!pop) return;
  if(pop.style.display!=="none" && pop.style.display){ fecharCustom(); return; }
  CR_START=RANGE_ATIVO.ini||null; CR_END=RANGE_ATIVO.fim||null;
  CR_VIEW=(RANGE_ATIVO.fim||_isoToday()).slice(0,7);
  pop.style.display="block";
  const bg=document.getElementById("cal-backdrop"); if(bg) bg.style.display="block";
  renderCal();
}
function fecharCustom(){
  const pop=document.getElementById("cal-pop"), bg=document.getElementById("cal-backdrop");
  if(pop) pop.style.display="none"; if(bg) bg.style.display="none";
}
function calNav(d){
  const p=CR_VIEW.split("-").map(Number); const nd=new Date(p[0], p[1]-1+d, 1);
  CR_VIEW=nd.getFullYear()+"-"+String(nd.getMonth()+1).padStart(2,"0"); renderCal();
}
function calPick(iso){
  if(!CR_START || (CR_START && CR_END)){ CR_START=iso; CR_END=null; }
  else if(iso<CR_START){ CR_END=CR_START; CR_START=iso; }
  else { CR_END=iso; }
  renderCal();
}
function renderCal(){
  const minD=_calMin(), maxD=_isoToday();
  const p=CR_VIEW.split("-").map(Number), y=p[0], m=p[1];
  document.getElementById("cal-title").textContent=_MESES_PT[m-1]+" "+y;
  const startWd=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let h=""; ["D","S","T","Q","Q","S","S"].forEach(w=>h+=`<span class="cal-wd">${w}</span>`);
  for(let i=0;i<startWd;i++) h+=`<span class="cal-day empty"></span>`;
  for(let d=1;d<=days;d++){
    const iso=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const off = iso<minD || iso>maxD;
    let cls="cal-day";
    if(off) cls+=" off";
    else if(iso===CR_START || iso===CR_END) cls+=" sel";
    else if(CR_START && CR_END && iso>CR_START && iso<CR_END) cls+=" inr";
    h+=`<span class="${cls}" ${off?"":`onclick="calPick('${iso}')"`}>${d}</span>`;
  }
  document.getElementById("cal-grid").innerHTML=h;
  const sel=document.getElementById("cal-sel"), btn=document.getElementById("cal-apply");
  if(CR_START && CR_END){ sel.textContent=_brData(CR_START)+" — "+_brData(CR_END); btn.disabled=false; }
  else if(CR_START){ sel.textContent="Início "+_brData(CR_START)+" · escolha o fim"; btn.disabled=true; }
  else { sel.textContent="Selecione o período"; btn.disabled=true; }
}
function aplicarCustom(){
  if(!CR_START || !CR_END) return;
  document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("on", b.dataset.p==="custom"));
  PERIODO_ATIVO="custom";
  setRangeAtivo(CR_START, CR_END);
  fecharCustom();
  atualizarPillPeriodo();
  renderGeral(); renderAvancado(); renderBase(); renderFontes(); afterRender(); renderCac(); afterRenderCac();
}
// Seleção de um MÊS específico (igual Google/Meta Ads) — full month, mês corrente = parcial até hoje.
function _monthBounds(ym){
  const p=ym.split("-"); const y=Number(p[0]), m=Number(p[1]);
  const last=new Date(y, m, 0).getDate();
  let fim=ym+"-"+String(last).padStart(2,"0");
  const today=_isoToday(); if(fim>today) fim=today;
  return {ini: ym+"-01", fim};
}
function aplicarMes(ym){
  if(!ym) return;
  const b=_monthBounds(ym);
  document.querySelectorAll(".preset").forEach(x=>x.classList.remove("on"));
  PERIODO_ATIVO="mes:"+ym;
  setRangeAtivo(b.ini, b.fim);
  atualizarPillPeriodo();
  renderGeral(); renderAvancado(); renderBase(); renderFontes(); afterRender(); renderCac(); afterRenderCac();
}
// Atualiza a pílula "Período: …" (cabeçalho) E o indicador fixo na preset bar, com o range REAL ativo.
function atualizarPillPeriodo(){
  const ini=RANGE_ATIVO.ini, fim=RANGE_ATIVO.fim;
  if(!ini||!fim){ return; }
  let txt;
  if(subMensal(ini,fim)){
    const dI=ini.slice(8,10), dF=fim.slice(8,10), ym=label_mes_js(_ymOf(ini));
    txt = (dI===dF) ? `${dI} ${ym}` : `${dI}–${dF} ${ym}`;
  } else {
    txt = `${label_mes_js(_ymOf(ini))} → ${label_mes_js(_ymOf(fim))}`;
  }
  const a=document.getElementById("periodo-pill-val"); if(a) a.textContent=txt;
  const b=document.getElementById("pb-periodo-val"); if(b) b.textContent=txt;
}

/* ─── Botão "🔄 Atualizar dados" — dispara a coleta no servidor (SSE) ─── */
const REGEN_CLIENTE = (new URLSearchParams(location.search).get("cliente"))
                      || (typeof CLI!=="undefined" && CLI && CLI.slug) || "08_motel_xenon";
// Em embed externo (/share/) o botão some — cliente não dispara coleta.
if(location.pathname.indexOf("/share/")===0){
  const _b=document.getElementById("btn-regerar"); if(_b)_b.style.display="none";
}
let _regenES=null, _regenFinished=false;
function regerarRelatorio(only){
  if(location.protocol==="file:"){
    alert("Abra o relatório pelo painel (brunosovc.com) para usar o botão Atualizar — pelo arquivo local não dá para rodar a coleta.");
    return;
  }
  const bg=document.getElementById("regen-bg"), logEl=document.getElementById("regen-log");
  const titleEl=document.getElementById("regen-title"), subEl=document.getElementById("regen-sub");
  const spin=document.getElementById("regen-spin"), closeBtn=document.getElementById("regen-close");
  const btn=document.getElementById("btn-regerar");
  _regenFinished=false;
  // only = atualização DINAMICA por fonte (ex.: 'organico,stories' após reconectar
  // o Reportei). Recoleta SÓ essas fontes (período completo), o resto fica intacto.
  const _soFontes = !!(only && (""+only).trim());
  // JANELA = período selecionado AGORA na presetbar. A coleta puxa SÓ essa janela
  // (rápido). Sem range válido cai na atualização completa (compat).
  const _r = (typeof RANGE_ATIVO!=="undefined" && RANGE_ATIVO) ? RANGE_ATIVO : {};
  const _temJanela = !_soFontes && !!(_r.ini && _r.fim);
  const _LBL={hoje:"hoje",semana:"esta semana",mes:"este mês",mespassado:"mês passado",
              trimestre:"este trimestre",ano:"o ano",custom:"o período"};
  const _labelPer = _LBL[(typeof PERIODO_ATIVO!=="undefined"?PERIODO_ATIVO:"")] || "o período";
  const _FONTE_LBL={organico:"orgânico (Reportei)",stories:"Stories",meta:"Meta Ads",gads:"Google Ads",crm:"CRM",gsc:"SEO/GSC",ga4:"GA4"};
  const _onlyLbl = _soFontes ? (""+only).split(",").map(s=>_FONTE_LBL[s.trim()]||s.trim()).join(" + ") : "";
  logEl.textContent=""; spin.className="regen-spin"; titleEl.textContent="Atualizando dados…";
  subEl.textContent = _soFontes
    ? ("Atualizando só: "+_onlyLbl+" — rápido, o resto do relatório fica intacto.")
    : (_temJanela
      ? ("Puxando os dados de "+_labelPer+" ("+_r.ini+" → "+_r.fim+") — só essa janela, é rápido.")
      : "Puxando Reportei, CRM, Meta, Google Ads, GSC e GA4 — isso leva alguns minutos.");
  closeBtn.style.display="none"; bg.classList.add("show");
  if(btn){ btn.disabled=true; }
  function add(line){ logEl.textContent += line + "\n"; logEl.scrollTop=logEl.scrollHeight; }
  if(_regenES){ try{_regenES.close();}catch(e){} }
  let _u="/api/relatorio-cliente/atualizar?cliente="+encodeURIComponent(REGEN_CLIENTE);
  if(_soFontes){ _u += "&only="+encodeURIComponent((""+only).trim()); }
  else if(_temJanela){ _u += "&ini="+encodeURIComponent(_r.ini)+"&fim="+encodeURIComponent(_r.fim)
                       +"&periodo="+encodeURIComponent((typeof PERIODO_ATIVO!=="undefined"?PERIODO_ATIVO:"")); }
  const es=new EventSource(_u);
  _regenES=es;
  es.onmessage=(ev)=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==="start"){ add("▶ iniciando coleta de "+m.cliente+" ("+m.start+" → "+m.end+")"); }
    else if(m.type==="progress"){ add(m.line); }
    else if(m.type==="ping"){ /* keepalive */ }
    else if(m.type==="done"){
      _regenFinished=true; try{es.close();}catch(e){} _regenES=null;
      spin.className="regen-spin done"; titleEl.textContent="Pronto! Dados atualizados";
      subEl.textContent="Recarregando o relatório com os números novos…";
      add("✅ concluído — recarregando…");
      setTimeout(()=>{
        try{ const u=new URL(location.href);
          if(typeof PERIODO_ATIVO!=="undefined" && PERIODO_ATIVO) u.searchParams.set("periodo",PERIODO_ATIVO);
          u.searchParams.set("_t", Date.now());
          location.href=u.toString();        // reload preservando o período selecionado
        }catch(e){ location.reload(); }
      }, 1300);
    }
    else if(m.type==="error"){
      _regenFinished=true; try{es.close();}catch(e){} _regenES=null;
      spin.className="regen-spin err"; titleEl.textContent="Falhou ao atualizar";
      subEl.textContent=m.msg||"erro na coleta"; add("❌ "+(m.msg||"erro"));
      closeBtn.style.display=""; if(btn){ btn.disabled=false; }
    }
  };
  es.onerror=()=>{
    if(_regenFinished) return;          // já fechou no done/error — ignora
    try{es.close();}catch(e){} _regenES=null;  // não reabre (evita disparar 2ª coleta)
    spin.className="regen-spin err"; titleEl.textContent="Conexão interrompida";
    subEl.textContent="A coleta pode seguir rodando no servidor. Recarregue o relatório em alguns minutos.";
    add("⚠️ conexão interrompida — a coleta pode continuar em segundo plano.");
    closeBtn.style.display=""; if(btn){ btn.disabled=false; }
  };
}
function fecharRegen(){ const bg=document.getElementById("regen-bg"); if(bg)bg.classList.remove("show");
  if(_regenES){ try{_regenES.close();}catch(e){} _regenES=null; }
  const btn=document.getElementById("btn-regerar"); if(btn)btn.disabled=false; }

buildTabs();
// popula o seletor de "Mês específico…" com os meses coletados (Jan/26 … Jun/26)
(function(){ const sel=document.getElementById("mes-sel"); if(!sel) return;
  (D.meses||[]).forEach(ym=>{ const o=document.createElement("option");
    o.value=ym; o.textContent=label_mes_js(ym); sel.appendChild(o); }); })();
// idioma inicial DERIVA do cliente (config injetada) e sincroniza o seletor
const _isel=document.getElementById("idioma-sel"); if(_isel) _isel.value = IDIOMA;
// período ativo inicial = preset marcado .on (default "ano")
const _pon=document.querySelector(".preset.on"); if(_pon) PERIODO_ATIVO=_pon.dataset.p||"mes";
// ...mas se veio ?periodo= na URL (reload pós-Atualizar), restaura o que o Bruno escolheu
(function(){ const _wp=new URLSearchParams(location.search).get("periodo");
  if(_wp && ["hoje","semana","mes","mespassado","trimestre","ano"].indexOf(_wp)>=0){
    PERIODO_ATIVO=_wp;
    document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("on",b.dataset.p===_wp));
  } })();
{ const _r=rangeDoPreset(PERIODO_ATIVO); setRangeAtivo(_r.ini, _r.fim); }
atualizarPillPeriodo();
renderGeral();
renderAvancado();
renderBase();
renderFontes();
afterRender();
renderCac();
afterRenderCac();
// Local Falcon: o index.html é estático; ao abrir no painel, busca o histórico
// fresco da API e SÓ re-renderiza se mudou (novo scan feito desde o último render).
// Em PDF/offline a chamada falha em silêncio e o dado embutido permanece.
setTimeout(lfAutoRefresh, 500);
</script>
